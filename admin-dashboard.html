<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Dashboard | Nauza Tu Digital Motor Market</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    header h1 {
      font-size: 22px;
    }

    header p {
      font-size: 13px;
      color: #d1d5db;
      margin-top: 4px;
    }

    .logout-btn {
      background: #dc2626;
      color: white;
      border: none;
      padding: 11px 16px;
      border-radius: 7px;
      cursor: pointer;
      font-weight: bold;
    }

    .logout-btn:hover {
      background: #b91c1c;
    }

    .container {
      max-width: 1400px;
      margin: auto;
      padding: 20px;
    }

    .loading {
      background: white;
      padding: 25px;
      border-radius: 10px;
      text-align: center;
      margin-bottom: 20px;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
      white-space: pre-wrap;
    }

    .success {
      background: #dcfce7;
      color: #166534;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
    }

    /* STAT CARDS */

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      margin-bottom: 25px;
    }

    .stat-card {
      background: white;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .stat-card h3 {
      font-size: 14px;
      color: #6b7280;
      margin-bottom: 10px;
    }

    .stat-number {
      font-size: 30px;
      font-weight: bold;
    }

    .pending-number {
      color: #d97706;
    }

    .published-number {
      color: #15803d;
    }

    .sold-number {
      color: #6b7280;
    }

    /* CONTROLS */

    .controls {
      background: white;
      padding: 18px;
      border-radius: 10px;
      margin-bottom: 20px;
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      gap: 12px;
    }

    .controls input,
    .controls select {
      width: 100%;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 7px;
      font-size: 14px;
      background: white;
    }

    /* SECTION */

    .section {
      background: white;
      border-radius: 10px;
      margin-bottom: 25px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      overflow: hidden;
    }

    .section-header {
      padding: 17px 20px;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .section-header h2 {
      font-size: 18px;
    }

    .count-badge {
      background: #e5e7eb;
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
    }

    /* VEHICLE CARDS */

    .vehicle-list {
      padding: 15px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .vehicle-card {
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      overflow: hidden;
      background: white;
    }

    .vehicle-top {
      display: flex;
      gap: 15px;
      padding: 15px;
    }

    .vehicle-image {
      width: 170px;
      height: 120px;
      border-radius: 8px;
      object-fit: cover;
      background: #e5e7eb;
      flex-shrink: 0;
    }

    .vehicle-info {
      flex: 1;
      min-width: 0;
    }

    .vehicle-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .listing-id {
      font-size: 12px;
      color: #6b7280;
      margin-bottom: 8px;
    }

    .price {
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .details {
      font-size: 13px;
      line-height: 1.7;
      color: #4b5563;
    }

    .status {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: bold;
      margin-top: 8px;
    }

    .status-pending {
      background: #fef3c7;
      color: #92400e;
    }

    .status-published {
      background: #dcfce7;
      color: #166534;
    }

    .status-sold {
      background: #e5e7eb;
      color: #374151;
    }

    .status-other {
      background: #fee2e2;
      color: #991b1b;
    }

    /* VENDOR */

    .vendor-box {
      background: #f9fafb;
      border-top: 1px solid #e5e7eb;
      padding: 13px 15px;
      font-size: 13px;
      line-height: 1.7;
    }

    .vendor-box strong {
      color: #111827;
    }

    /* ACTIONS */

    .actions {
      padding: 13px 15px;
      border-top: 1px solid #e5e7eb;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .action-btn {
      border: none;
      border-radius: 6px;
      padding: 10px 12px;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
      text-decoration: none;
      display: inline-block;
    }

    .view-btn {
      background: #e5e7eb;
      color: #111827;
    }

    .edit-btn {
      background: #dbeafe;
      color: #1d4ed8;
    }

    .approve-btn {
      background: #15803d;
      color: white;
      font-size: 13px;
      padding: 11px 15px;
    }

    .approve-btn:hover {
      background: #166534;
    }

    .sold-btn {
      background: #6b7280;
      color: white;
    }

    .publish-btn {
      background: #2563eb;
      color: white;
    }

    .delete-btn {
      background: #dc2626;
      color: white;
    }

    .action-btn:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    /* EMPTY */

    .empty {
      padding: 35px 20px;
      text-align: center;
      color: #6b7280;
    }

    /* VENDORS */

    .vendor-list {
      padding: 15px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
    }

    .vendor-card {
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 15px;
      line-height: 1.8;
      font-size: 13px;
    }

    .vendor-card h3 {
      font-size: 16px;
      margin-bottom: 7px;
    }

    /* RESPONSIVE */

    @media (max-width: 1000px) {
      .stats {
        grid-template-columns: repeat(2, 1fr);
      }

      .vehicle-list {
        grid-template-columns: 1fr;
      }

      .vendor-list {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 650px) {
      header {
        align-items: flex-start;
      }

      .container {
        padding: 12px;
      }

      .stats {
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .stat-card {
        padding: 15px;
      }

      .stat-number {
        font-size: 24px;
      }

      .controls {
        grid-template-columns: 1fr;
      }

      .vehicle-top {
        flex-direction: column;
      }

      .vehicle-image {
        width: 100%;
        height: 190px;
      }

      .vendor-list {
        grid-template-columns: 1fr;
      }

      .actions {
        flex-direction: column;
      }

      .action-btn {
        width: 100%;
        text-align: center;
      }
    }
  </style>
</head>

<body>

<header>
  <div>
    <h1>Nauza Tu Digital Motor Market</h1>
    <p>Administrator Dashboard</p>
  </div>

  <button class="logout-btn" onclick="logout()">Logout</button>
</header>

<div class="container">

  <div id="loading" class="loading">
    Checking administrator access...
  </div>

  <div id="errorMessage" class="error"></div>
  <div id="successMessage" class="success"></div>

  <div id="dashboard" style="display:none;">

    <!-- STATISTICS -->

    <div class="stats">

      <div class="stat-card">
        <h3>Total Vehicles</h3>
        <div id="totalVehicles" class="stat-number">0</div>
      </div>

      <div class="stat-card">
        <h3>Pending Approval</h3>
        <div id="pendingVehicles" class="stat-number pending-number">0</div>
      </div>

      <div class="stat-card">
        <h3>Published</h3>
        <div id="publishedVehicles" class="stat-number published-number">0</div>
      </div>

      <div class="stat-card">
        <h3>Sold</h3>
        <div id="soldVehicles" class="stat-number sold-number">0</div>
      </div>

    </div>

    <!-- SEARCH / FILTER -->

    <div class="controls">

      <input
        type="text"
        id="searchInput"
        placeholder="Search make, model, listing ID, location or vendor..."
        oninput="renderVehicles()"
      >

      <select id="statusFilter" onchange="renderVehicles()">
        <option value="all">All Statuses</option>
        <option value="pending">Pending Approval</option>
        <option value="published">Published</option>
        <option value="sold">Sold</option>
      </select>

      <select id="categoryFilter" onchange="renderVehicles()">
        <option value="all">All Categories</option>
      </select>

    </div>

    <!-- VEHICLES -->

    <div class="section">

      <div class="section-header">
        <h2>Vehicle Listings</h2>
        <span id="vehicleCount" class="count-badge">0 vehicles</span>
      </div>

      <div id="vehicleList" class="vehicle-list"></div>

    </div>

    <!-- VENDORS -->

    <div class="section">

      <div class="section-header">
        <h2>Registered Vendors</h2>
        <span id="vendorCount" class="count-badge">0 vendors</span>
      </div>

      <div id="vendorList" class="vendor-list"></div>

    </div>

  </div>

</div>

<script>

  /* =========================================================
     SUPABASE
  ========================================================= */

  const SUPABASE_URL = "https://hoogdxegjomtsvaddkwk.supabase.co";

  const SUPABASE_KEY = "sb_publishable_VEq6gUDlCthklOIgVUaDzQ_5TaqAsu8";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


  /* =========================================================
     GLOBAL DATA
  ========================================================= */

  let currentUser = null;
  let vehicles = [];
  let vendors = [];


  /* =========================================================
     PAGE START
  ========================================================= */

  document.addEventListener("DOMContentLoaded", async function () {
    await checkAdmin();
  });


  /* =========================================================
     ADMIN CHECK
  ========================================================= */

  async function checkAdmin() {

    try {

      const {
        data: sessionData,
        error: sessionError
      } = await supabaseClient.auth.getSession();

      if (sessionError) {
        throw sessionError;
      }

      const session = sessionData.session;

      if (!session || !session.user) {
        window.location.href = "admin-login.html";
        return;
      }

      currentUser = session.user;

      const {
        data: adminRecord,
        error: adminError
      } = await supabaseClient
        .from("admin_users")
        .select("id,email,role,active")
        .eq("id", currentUser.id)
        .eq("active", true)
        .maybeSingle();

      if (adminError) {
        throw adminError;
      }

      if (!adminRecord || adminRecord.role !== "admin") {

        showError(
          "Access denied. This account is not authorized as an administrator."
        );

        await supabaseClient.auth.signOut();

        setTimeout(function () {
          window.location.href = "admin-login.html";
        }, 2500);

        return;
      }

      document.getElementById("loading").style.display = "none";
      document.getElementById("dashboard").style.display = "block";

      await loadDashboard();

    } catch (error) {

      console.error(error);

      document.getElementById("loading").style.display = "none";

      showError(
        "Could not load administrator dashboard.\n\n" +
        (error.message || error)
      );
    }
  }


  /* =========================================================
     LOAD DASHBOARD
  ========================================================= */

  async function loadDashboard() {

    await Promise.all([
      loadVehicles(),
      loadVendors()
    ]);

    updateStatistics();
    buildCategoryFilter();
    renderVehicles();
    renderVendors();
  }


  /* =========================================================
     LOAD VEHICLES
  ========================================================= */

  async function loadVehicles() {

    const {
      data,
      error
    } = await supabaseClient
      .from("vehicles")
      .select("*")
      .order("created_at", { ascending: false });

    if (error) {
      throw error;
    }

    vehicles = data || [];
  }


  /* =========================================================
     LOAD VENDORS
  ========================================================= */

  async function loadVendors() {

    const {
      data,
      error
    } = await supabaseClient
      .from("vendor_profiles")
      .select("*")
      .order("created_at", { ascending: false });

    if (error) {

      console.warn(
        "Vendor profiles could not be loaded:",
        error.message
      );

      vendors = [];
      return;
    }

    vendors = data || [];
  }


  /* =========================================================
     STATISTICS
  ========================================================= */

  function updateStatistics() {

    const total = vehicles.length;

    const pending = vehicles.filter(function (vehicle) {
      return String(vehicle.status || "").toLowerCase() === "pending";
    }).length;

    const published = vehicles.filter(function (vehicle) {
      return String(vehicle.status || "").toLowerCase() === "published";
    }).length;

    const sold = vehicles.filter(function (vehicle) {
      return String(vehicle.status || "").toLowerCase() === "sold";
    }).length;

    document.getElementById("totalVehicles").textContent = total;
    document.getElementById("pendingVehicles").textContent = pending;
    document.getElementById("publishedVehicles").textContent = published;
    document.getElementById("soldVehicles").textContent = sold;
  }


  /* =========================================================
     CATEGORY FILTER
  ========================================================= */

  function buildCategoryFilter() {

    const select = document.getElementById("categoryFilter");

    const categories = [];

    vehicles.forEach(function (vehicle) {

      if (vehicle.category) {

        const category = String(vehicle.category).trim();

        if (
          category &&
          !categories.includes(category)
        ) {
          categories.push(category);
        }
      }
    });

    categories.sort();

    select.innerHTML =
      '<option value="all">All Categories</option>';

    categories.forEach(function (category) {

      const option = document.createElement("option");

      option.value = category;
      option.textContent = category;

      select.appendChild(option);
    });
  }


  /* =========================================================
     RENDER VEHICLES
  ========================================================= */

  function renderVehicles() {

    const container = document.getElementById("vehicleList");

    const search =
      document.getElementById("searchInput")
        .value
        .trim()
        .toLowerCase();

    const statusFilter =
      document.getElementById("statusFilter").value;

    const categoryFilter =
      document.getElementById("categoryFilter").value;

    let filtered = vehicles.filter(function (vehicle) {

      const status =
        String(vehicle.status || "")
          .trim()
          .toLowerCase();

      const category =
        String(vehicle.category || "").trim();

      const sellerText =
        getSellerText(vehicle).toLowerCase();

      const searchText = [
        vehicle.listing_id,
        vehicle.make,
        vehicle.model,
        vehicle.location,
        vehicle.year,
        vehicle.category,
        sellerText
      ]
        .filter(Boolean)
        .join(" ")
        .toLowerCase();

      const matchesSearch =
        !search || searchText.includes(search);

      const matchesStatus =
        statusFilter === "all" ||
        status === statusFilter;

      const matchesCategory =
        categoryFilter === "all" ||
        category === categoryFilter;

      return (
        matchesSearch &&
        matchesStatus &&
        matchesCategory
      );
    });

    document.getElementById("vehicleCount").textContent =
      filtered.length +
      (filtered.length === 1 ? " vehicle" : " vehicles");

    if (!filtered.length) {

      container.innerHTML = `
        <div class="empty">
          No vehicle listings match the selected filters.
        </div>
      `;

      return;
    }

    container.innerHTML = filtered
      .map(function (vehicle) {
        return createVehicleCard(vehicle);
      })
      .join("");
  }


  /* =========================================================
     SELLER DATA
  ========================================================= */

  function getSeller(vehicle) {

    let seller = vehicle.seller;

    if (!seller) {
      return {};
    }

    if (typeof seller === "string") {

      try {
        seller = JSON.parse(seller);
      } catch (error) {
        return {};
      }
    }

    return seller || {};
  }


  function getSellerText(vehicle) {

    const seller = getSeller(vehicle);

    const vendor =
      vendors.find(function (item) {
        return item.id === vehicle.vendor_id;
      });

    return [
      seller.name,
      seller.phone,
      seller.whatsapp,
      seller.businessName,
      seller.business_name,
      vendor ? vendor.full_name : "",
      vendor ? vendor.phone : "",
      vendor ? vendor.business_name : ""
    ]
      .filter(Boolean)
      .join(" ");
  }


  /* =========================================================
     VENDOR INFO
  ========================================================= */

  function getVendorInfo(vehicle) {

    const seller = getSeller(vehicle);

    const vendor =
      vendors.find(function (item) {
        return item.id === vehicle.vendor_id;
      });

    return {
      name:
        (vendor && vendor.full_name) ||
        seller.name ||
        "Not provided",

      phone:
        (vendor && vendor.phone) ||
        seller.phone ||
        "Not provided",

      whatsapp:
        (vendor && vendor.whatsapp) ||
        seller.whatsapp ||
        "Not provided",

      business:
        (vendor && vendor.business_name) ||
        seller.businessName ||
        seller.business_name ||
        "Private Seller",

      location:
        (vendor && vendor.location) ||
        "Not provided"
    };
  }


  /* =========================================================
     IMAGE
  ========================================================= */

  function getMainImage(vehicle) {

    if (
      vehicle.main_image &&
      String(vehicle.main_image).startsWith("http")
    ) {
      return vehicle.main_image;
    }

    let images = vehicle.images;

    if (typeof images === "string") {

      try {
        images = JSON.parse(images);
      } catch (error) {
        images = [];
      }
    }

    if (Array.isArray(images)) {

      const firstImage = images.find(function (image) {
        return image && String(image).startsWith("http");
      });

      if (firstImage) {
        return firstImage;
      }
    }

    return "https://via.placeholder.com/600x400?text=No+Vehicle+Photo";
  }


  /* =========================================================
     PRICE
  ========================================================= */

  function formatPrice(price) {

    if (
      price === null ||
      price === undefined ||
      price === ""
    ) {
      return "Price on request";
    }

    const number = Number(price);

    if (isNaN(number)) {
      return String(price);
    }

    return "KES " + number.toLocaleString("en-KE");
  }


  /* =========================================================
     STATUS
  ========================================================= */

  function statusClass(status) {

    status = String(status || "").toLowerCase();

    if (status === "pending") {
      return "status-pending";
    }

    if (status === "published") {
      return "status-published";
    }

    if (status === "sold") {
      return "status-sold";
    }

    return "status-other";
  }


  function statusLabel(status) {

    status = String(status || "").toLowerCase();

    if (status === "pending") {
      return "PENDING APPROVAL";
    }

    if (status === "published") {
      return "PUBLISHED";
    }

    if (status === "sold") {
      return "SOLD";
    }

    return status.toUpperCase();
  }


  /* =========================================================
     VEHICLE CARD
  ========================================================= */

  function createVehicleCard(vehicle) {

    const status =
      String(vehicle.status || "pending")
        .toLowerCase();

    const vendor = getVendorInfo(vehicle);

    const title = [
      vehicle.make,
      vehicle.model
    ]
      .filter(Boolean)
      .join(" ");

    const viewUrl =
      "vehicle-details.html?id=" +
      encodeURIComponent(vehicle.id);

    let actions = `
      <a
        class="action-btn view-btn"
        href="${viewUrl}"
        target="_blank"
      >
        View
      </a>

      <a
        class="action-btn edit-btn"
        href="vendor-edit-vehicle.html?id=${encodeURIComponent(vehicle.id)}"
        target="_blank"
      >
        Edit
      </a>
    `;


    /*
      PENDING:
      Show the important APPROVE & PUBLISH button.
    */

    if (status === "pending") {

      actions += `
        <button
          class="action-btn approve-btn"
          onclick="approveVehicle('${escapeJs(vehicle.id)}')"
        >
          ✓ APPROVE & PUBLISH
        </button>

        <button
          class="action-btn delete-btn"
          onclick="deleteVehicle('${escapeJs(vehicle.id)}')"
        >
          Delete
        </button>
      `;
    }


    /*
      PUBLISHED:
      Show Mark as Sold.
    */

    else if (status === "published") {

      actions += `
        <button
          class="action-btn sold-btn"
          onclick="markSold('${escapeJs(vehicle.id)}')"
        >
          Mark as Sold
        </button>

        <button
          class="action-btn delete-btn"
          onclick="deleteVehicle('${escapeJs(vehicle.id)}')"
        >
          Delete
        </button>
      `;
    }


    /*
      SOLD:
      Allow admin to publish again.
    */

    else if (status === "sold") {

      actions += `
        <button
          class="action-btn publish-btn"
          onclick="publishVehicle('${escapeJs(vehicle.id)}')"
        >
          Publish Again
        </button>

        <button
          class="action-btn delete-btn"
          onclick="deleteVehicle('${escapeJs(vehicle.id)}')"
        >
          Delete
        </button>
      `;
    }


    /*
      OTHER STATUS
    */

    else {

      actions += `
        <button
          class="action-btn publish-btn"
          onclick="publishVehicle('${escapeJs(vehicle.id)}')"
        >
          Publish
        </button>

        <button
          class="action-btn delete-btn"
          onclick="deleteVehicle('${escapeJs(vehicle.id)}')"
        >
          Delete
        </button>
      `;
    }


    return `
      <div class="vehicle-card">

        <div class="vehicle-top">

          <img
            class="vehicle-image"
            src="${escapeAttribute(getMainImage(vehicle))}"
            alt="${escapeAttribute(title || "Vehicle")}"
            onerror="this.src='https://via.placeholder.com/600x400?text=No+Vehicle+Photo'"
          >

          <div class="vehicle-info">

            <div class="vehicle-title">
              ${escapeHtml(title || "Vehicle")}
            </div>

            <div class="listing-id">
              Listing ID:
              <strong>
                ${escapeHtml(vehicle.listing_id || "N/A")}
              </strong>
            </div>

            <div class="price">
              ${escapeHtml(formatPrice(vehicle.price))}
            </div>

            <div class="details">

              <strong>Year:</strong>
              ${escapeHtml(vehicle.year || "N/A")}
              <br>

              <strong>Category:</strong>
              ${escapeHtml(vehicle.category || "N/A")}
              <br>

              <strong>Location:</strong>
              ${escapeHtml(vehicle.location || "N/A")}
              <br>

              <strong>Mileage:</strong>
              ${escapeHtml(vehicle.mileage || "N/A")}
              <br>

              <strong>Transmission:</strong>
              ${escapeHtml(vehicle.transmission || "N/A")}

            </div>

            <span class="status ${statusClass(status)}">
              ${statusLabel(status)}
            </span>

          </div>

        </div>


        <div class="vendor-box">

          <strong>Vendor / Seller</strong><br>

          Name:
          ${escapeHtml(vendor.name)}
          <br>

          Business:
          ${escapeHtml(vendor.business)}
          <br>

          Phone:
          ${escapeHtml(vendor.phone)}
          <br>

          WhatsApp:
          ${escapeHtml(vendor.whatsapp)}
          <br>

          Location:
          ${escapeHtml(vendor.location)}

        </div>


        <div class="actions">
          ${actions}
        </div>

      </div>
    `;
  }


  /* =========================================================
     APPROVE AND PUBLISH
  ========================================================= */

  async function approveVehicle(id) {

    const vehicle = vehicles.find(function (item) {
      return item.id === id;
    });

    if (!vehicle) {
      showError("Vehicle could not be found.");
      return;
    }

    const title = [
      vehicle.make,
      vehicle.model,
      vehicle.year
    ]
      .filter(Boolean)
      .join(" ");

    const confirmed = confirm(
      "Approve and publish this vehicle?\n\n" +
      title +
      "\n\n" +
      "It will immediately become visible on the public Vehicles page."
    );

    if (!confirmed) {
      return;
    }

    try {

      disableButtons(true);

      const {
        data,
        error
      } = await supabaseClient
        .from("vehicles")
        .update({
          status: "published"
        })
        .eq("id", id);

      if (error) {
        throw error;
      }

      showSuccess(
        "Vehicle approved and published successfully."
      );

      await loadVehicles();

      updateStatistics();
      buildCategoryFilter();
      renderVehicles();

    } catch (error) {

      console.error(error);

      showError(
        "Could not publish vehicle.\n\n" +
        (error.message || error)
      );

    } finally {

      disableButtons(false);
    }
  }

  /* =========================================================
     DELETE
  ========================================================= */

  async function deleteVehicle(id) {

    const vehicle = vehicles.find(function (item) {
      return item.id === id;
    });

    const title = vehicle
      ? [
          vehicle.make,
          vehicle.model,
          vehicle.year
        ]
        .filter(Boolean)
        .join(" ")
      : "this vehicle";

    const confirmed = confirm(
      "DELETE this vehicle listing?\n\n" +
      title +
      "\n\n" +
      "This action cannot be undone."
    );

    if (!confirmed) {
      return;
    }

    try {

      disableButtons(true);

      const {
        error
      } = await supabaseClient
        .from("vehicles")
        .delete()
        .eq("id", id);

      if (error) {
        throw error;
      }

      showSuccess(
        "Vehicle listing deleted."
      );

      await loadVehicles();

      updateStatistics();
      buildCategoryFilter();
      renderVehicles();

    } catch (error) {

      console.error(error);

      showError(
        "Could not delete vehicle.\n\n" +
        (error.message || error)
      );

    } finally {

      disableButtons(false);
    }
  }


  /* =========================================================
     VENDORS
  ========================================================= */

  function renderVendors() {

    const container =
      document.getElementById("vendorList");

    document.getElementById("vendorCount").textContent =
      vendors.length +
      (vendors.length === 1 ? " vendor" : " vendors");

    if (!vendors.length) {

      container.innerHTML = `
        <div class="empty">
          No vendor profiles found.
        </div>
      `;

      return;
    }

    container.innerHTML = vendors
      .map(function (vendor) {

        const vehicleCount =
          vehicles.filter(function (vehicle) {
            return vehicle.vendor_id === vendor.id;
          }).length;

        return `
          <div class="vendor-card">

            <h3>
              ${escapeHtml(
                vendor.business_name ||
                vendor.full_name ||
                "Vendor"
              )}
            </h3>

            <strong>Name:</strong>
            ${escapeHtml(vendor.full_name || "N/A")}
            <br>

            <strong>Phone:</strong>
            ${escapeHtml(vendor.phone || "N/A")}
            <br>

            <strong>WhatsApp:</strong>
            ${escapeHtml(vendor.whatsapp || "N/A")}
            <br>

            <strong>Location:</strong>
            ${escapeHtml(vendor.location || "N/A")}
            <br>

            <strong>Listings:</strong>
            ${vehicleCount}

          </div>
        `;
      })
      .join("");
  }


  /* =========================================================
     LOGOUT
  ========================================================= */

  async function logout() {

    const confirmed = confirm(
      "Log out of the administrator dashboard?"
    );

    if (!confirmed) {
      return;
    }

    await supabaseClient.auth.signOut();

    window.location.href = "admin-login.html";
  }


  /* =========================================================
     BUTTON CONTROL
  ========================================================= */

  function disableButtons(disabled) {

    const buttons =
      document.querySelectorAll(".action-btn");

    buttons.forEach(function (button) {
      button.disabled = disabled;
    });
  }


  /* =========================================================
     MESSAGES
  ========================================================= */

  function showError(message) {

    const errorBox =
      document.getElementById("errorMessage");

    const successBox =
      document.getElementById("successMessage");

    successBox.style.display = "none";

    errorBox.textContent = message;
    errorBox.style.display = "block";

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });
  }


  function showSuccess(message) {

    const errorBox =
      document.getElementById("errorMessage");

    const successBox =
      document.getElementById("successMessage");

    errorBox.style.display = "none";

    successBox.textContent = message;
    successBox.style.display = "block";

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

    setTimeout(function () {
      successBox.style.display = "none";
    }, 5000);
  }


  /* =========================================================
     SECURITY / HTML ESCAPING
  ========================================================= */

  function escapeHtml(value) {

    if (value === null || value === undefined) {
      return "";
    }

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }


  function escapeAttribute(value) {
    return escapeHtml(value);
  }


  function escapeJs(value) {

    if (value === null || value === undefined) {
      return "";
    }

    return String(value)
      .replace(/\\/g, "\\\\")
      .replace(/'/g, "\\'")
      .replace(/"/g, '\\"')
      .replace(/\n/g, "\\n")
      .replace(/\r/g, "\\r");
  }
