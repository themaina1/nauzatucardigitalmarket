<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Dashboard | Nauza Tu Digital Motor Market</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: #f4f6f8;
        color: #222;
    }

    header {
        background: #063d28;
        color: white;
        padding: 18px 20px;
    }

    .header-inner {
        max-width: 1200px;
        margin: auto;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 15px;
        flex-wrap: wrap;
    }

    header h1 {
        margin: 0;
        font-size: 22px;
    }

    header p {
        margin: 5px 0 0;
        font-size: 13px;
        opacity: .9;
    }

    .logout-btn {
        background: #c62828;
        color: white;
        border: none;
        padding: 10px 16px;
        border-radius: 6px;
        cursor: pointer;
        font-weight: bold;
    }

    .container {
        max-width: 1200px;
        margin: 25px auto;
        padding: 0 15px;
    }

    .admin-nav {
        background: white;
        border-radius: 10px;
        padding: 15px;
        margin-bottom: 20px;
        box-shadow: 0 2px 8px rgba(0,0,0,.08);
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
    }

    .nav-btn {
        display: inline-block;
        text-decoration: none;
        background: #063d28;
        color: white;
        padding: 11px 16px;
        border-radius: 7px;
        font-weight: bold;
        font-size: 14px;
    }

    .nav-btn:hover {
        background: #075638;
    }

    .nav-btn.vendor {
        background: #b8860b;
    }

    .nav-btn.vendor:hover {
        background: #9f7609;
    }

    .stats {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 15px;
        margin-bottom: 25px;
    }

    .stat {
        background: white;
        border-radius: 10px;
        padding: 20px;
        box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    .stat h3 {
        margin: 0;
        font-size: 14px;
        color: #666;
    }

    .stat strong {
        display: block;
        font-size: 30px;
        margin-top: 8px;
        color: #063d28;
    }

    .toolbar {
        background: white;
        padding: 15px;
        border-radius: 10px;
        margin-bottom: 20px;
        box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    .toolbar form {
        display: grid;
        grid-template-columns: 1fr 180px 180px 100px;
        gap: 10px;
    }

    input,
    select {
        width: 100%;
        padding: 11px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 14px;
    }

    .search-btn {
        background: #063d28;
        color: white;
        border: none;
        border-radius: 6px;
        font-weight: bold;
        cursor: pointer;
    }

    .section {
        margin-bottom: 30px;
    }

    .section h2 {
        background: #063d28;
        color: white;
        margin: 0 0 12px;
        padding: 13px 15px;
        border-radius: 8px;
        font-size: 18px;
    }

    .vehicle-card {
        background: white;
        border-radius: 10px;
        padding: 15px;
        margin-bottom: 12px;
        box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    .vehicle-grid {
        display: grid;
        grid-template-columns: 170px 1fr;
        gap: 18px;
    }

    .vehicle-image {
        width: 170px;
        height: 125px;
        object-fit: cover;
        border-radius: 8px;
        background: #eee;
    }

    .vehicle-info h3 {
        margin: 0 0 7px;
        color: #063d28;
    }

    .vehicle-info p {
        margin: 5px 0;
        font-size: 14px;
    }

    .seller-box {
        background: #f5f7f8;
        border-radius: 7px;
        padding: 10px;
        margin-top: 10px;
    }

    .seller-box strong {
        color: #063d28;
    }

    .actions {
        margin-top: 14px;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
    }

    .action-btn {
        border: none;
        padding: 9px 13px;
        border-radius: 6px;
        cursor: pointer;
        color: white;
        font-weight: bold;
        font-size: 13px;
    }

    .approve {
        background: #16803c;
    }

    .view {
        background: #1565c0;
    }

    .sold {
        background: #795548;
    }

    .publish {
        background: #16803c;
    }

    .feature {
        background: #b8860b;
    }

    .delete {
        background: #c62828;
    }

    .empty {
        background: white;
        padding: 25px;
        border-radius: 8px;
        text-align: center;
        color: #777;
    }

    .badge {
        display: inline-block;
        padding: 4px 8px;
        border-radius: 20px;
        font-size: 11px;
        font-weight: bold;
        background: #eee;
    }

    .badge.pending {
        background: #fff3cd;
        color: #856404;
    }

    .badge.published {
        background: #d4edda;
        color: #155724;
    }

    .badge.sold {
        background: #e2e3e5;
        color: #383d41;
    }

    .loading {
        text-align: center;
        padding: 30px;
        color: #666;
    }

    .error {
        background: #ffebee;
        color: #b71c1c;
        padding: 15px;
        border-radius: 8px;
        margin-bottom: 20px;
        display: none;
    }

    footer {
        text-align: center;
        color: #777;
        padding: 30px 15px;
        font-size: 13px;
    }

    @media (max-width: 800px) {
        .stats {
            grid-template-columns: repeat(2, 1fr);
        }

        .toolbar form {
            grid-template-columns: 1fr;
        }

        .vehicle-grid {
            grid-template-columns: 1fr;
        }

        .vehicle-image {
            width: 100%;
            height: 210px;
        }
    }

    @media (max-width: 450px) {
        .stats {
            grid-template-columns: 1fr 1fr;
        }

        .stat strong {
            font-size: 24px;
        }

        header h1 {
            font-size: 18px;
        }
    }
</style>
</head>

<body>

<header>
    <div class="header-inner">
        <div>
            <h1>Nauza Tu Digital Motor Market</h1>
            <p>Administrator Dashboard</p>
        </div>

        <button class="logout-btn" onclick="logout()">
            Logout
        </button>
    </div>
</header>

<div class="container">

    <!-- ADMIN NAVIGATION -->
    <div class="admin-nav">

        <a href="admin.html" class="nav-btn">
            🚗 Vehicle Management
        </a>

        <a href="admin-vendors.html" class="nav-btn vendor">
            👥 Manage Vendors
        </a>

    </div>

    <div id="errorBox" class="error"></div>

    <!-- STATISTICS -->
    <div class="stats">

        <div class="stat">
            <h3>Total Vehicles</h3>
            <strong id="totalVehicles">0</strong>
        </div>

        <div class="stat">
            <h3>Pending Approval</h3>
            <strong id="pendingVehicles">0</strong>
        </div>

        <div class="stat">
            <h3>Published</h3>
            <strong id="publishedVehicles">0</strong>
        </div>

        <div class="stat">
            <h3>Sold</h3>
            <strong id="soldVehicles">0</strong>
        </div>

    </div>

    <!-- SEARCH -->
    <div class="toolbar">

        <form id="searchForm">

            <input
                type="text"
                id="searchInput"
                placeholder="Search vehicle, listing ID, vendor or location..."
            >

            <select id="statusFilter">
                <option value="all">All Statuses</option>
                <option value="pending">Pending</option>
                <option value="published">Published</option>
                <option value="sold">Sold</option>
            </select>

            <select id="categoryFilter">
                <option value="all">All Categories</option>
                <option value="SUV">SUV</option>
                <option value="Sedan">Sedan</option>
                <option value="Hatchback">Hatchback</option>
                <option value="Van">Van</option>
                <option value="Pickup">Pickup</option>
                <option value="Land Cruiser">Land Cruiser</option>
                <option value="Other">Other</option>
            </select>

            <button type="submit" class="search-btn">
                Search
            </button>

        </form>

    </div>

    <!-- PENDING -->
    <div class="section">

        <h2>
            Pending Approval
        </h2>

        <div id="pendingList">
            <div class="loading">Loading...</div>
        </div>

    </div>

    <!-- PUBLISHED -->
    <div class="section">

        <h2>
            Published Vehicles
        </h2>

        <div id="publishedList">
            <div class="loading">Loading...</div>
        </div>

    </div>

    <!-- SOLD -->
    <div class="section">

        <h2>
            Sold Vehicles
        </h2>

        <div id="soldList">
            <div class="loading">Loading...</div>
        </div>

    </div>

</div>

<footer>
    © 2026 Nauza Tu Digital Motor Market
</footer>


<script>

const SUPABASE_URL = "https://hoogdxegjomtsvaddkwk.supabase.co";

const SUPABASE_KEY =
"sb_publishable_VEq6gUDlCthklOIgVUaDzQ_5TaqAsu8";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


let allVehicles = [];


/* ================================
   SHOW ERROR
================================ */

function showError(message) {

    const box = document.getElementById("errorBox");

    box.textContent = message;
    box.style.display = "block";
}


/* ================================
   HIDE ERROR
================================ */

function hideError() {

    const box = document.getElementById("errorBox");

    box.textContent = "";
    box.style.display = "none";
}


/* ================================
   ADMIN CHECK
================================ */

async function checkAdmin() {

    const {
        data: {
            user
        },
        error
    } = await supabaseClient.auth.getUser();

    if (error || !user) {

        window.location.href = "admin-login.html";
        return false;
    }

    const {
        data: admin,
        error: adminError
    } = await supabaseClient
        .from("admin_users")
        .select("*")
        .eq("id", user.id)
        .eq("role", "admin")
        .eq("active", true)
        .maybeSingle();

    if (adminError || !admin) {

        await supabaseClient.auth.signOut();

        alert("This account is not authorized as an administrator.");

        window.location.href = "admin-login.html";

        return false;
    }

    return true;
}


/* ================================
   LOAD VEHICLES
================================ */

async function loadVehicles() {

    hideError();

    const {
        data,
        error
    } = await supabaseClient
        .from("vehicles")
        .select("*")
        .order("created_at", {
            ascending: false
        });

    if (error) {

        console.error(error);

        showError(
            "Could not load vehicles: " + error.message
        );

        return;
    }

    allVehicles = data || [];

    updateStats();

    renderVehicles();
}


/* ================================
   UPDATE STATS
================================ */

function updateStats() {

    const total =
        allVehicles.length;

    const pending =
        allVehicles.filter(
            v => v.status === "pending"
        ).length;

    const published =
        allVehicles.filter(
            v => v.status === "published"
        ).length;

    const sold =
        allVehicles.filter(
            v => v.status === "sold"
        ).length;

    document.getElementById(
        "totalVehicles"
    ).textContent = total;

    document.getElementById(
        "pendingVehicles"
    ).textContent = pending;

    document.getElementById(
        "publishedVehicles"
    ).textContent = published;

    document.getElementById(
        "soldVehicles"
    ).textContent = sold;
}


/* ================================
   PARSE SELLER
================================ */

function getSeller(vehicle) {

    if (!vehicle.seller) {

        return {};
    }

    if (typeof vehicle.seller === "object") {

        return vehicle.seller;
    }

    try {

        return JSON.parse(vehicle.seller);

    } catch {

        return {};
    }
}


/* ================================
   VEHICLE IMAGE
================================ */

function getVehicleImage(vehicle) {

    if (
        vehicle.main_image &&
        vehicle.main_image.startsWith("http")
    ) {

        return vehicle.main_image;
    }

    if (
        vehicle.main_image &&
        vehicle.main_image.startsWith("/")
    ) {

        return vehicle.main_image;
    }

    return "https://via.placeholder.com/600x400?text=No+Vehicle+Photo";
}


/* ================================
   FORMAT PRICE
================================ */

function formatPrice(price) {

    if (
        price === null ||
        price === undefined ||
        price === ""
    ) {

        return "Price on Request";
    }

    const number =
        Number(price);

    if (isNaN(number)) {

        return price;
    }

    return "KES " +
        number.toLocaleString();
}


/* ================================
   FILTER VEHICLES
================================ */

function getFilteredVehicles() {

    const search =
        document.getElementById(
            "searchInput"
        ).value
        .trim()
        .toLowerCase();

    const status =
        document.getElementById(
            "statusFilter"
        ).value;

    const category =
        document.getElementById(
            "categoryFilter"
        ).value;

    return allVehicles.filter(vehicle => {

        if (
            status !== "all" &&
            vehicle.status !== status
        ) {

            return false;
        }

        if (
            category !== "all" &&
            vehicle.category !== category
        ) {

            return false;
        }

        if (!search) {

            return true;
        }

        const seller =
            getSeller(vehicle);

        const searchable = [

            vehicle.make,

            vehicle.model,

            vehicle.listing_id,

            vehicle.location,

            vehicle.category,

            vehicle.condition,

            seller.name,

            seller.businessName,

            seller.phone,

            vehicle.vendor_id

        ]
        .filter(Boolean)
        .join(" ")
        .toLowerCase();

        return searchable.includes(search);
    });
}


/* ================================
   RENDER VEHICLES
================================ */

function renderVehicles() {

    const vehicles =
        getFilteredVehicles();

    const pending =
        vehicles.filter(
            v => v.status === "pending"
        );

    const published =
        vehicles.filter(
            v => v.status === "published"
        );

    const sold =
        vehicles.filter(
            v => v.status === "sold"
        );


    document.getElementById(
        "pendingList"
    ).innerHTML =
        pending.length
            ? pending.map(renderVehicleCard).join("")
            : `<div class="empty">
                No pending vehicles.
               </div>`;


    document.getElementById(
        "publishedList"
    ).innerHTML =
        published.length
            ? published.map(renderVehicleCard).join("")
            : `<div class="empty">
                No published vehicles.
               </div>`;


    document.getElementById(
        "soldList"
    ).innerHTML =
        sold.length
            ? sold.map(renderVehicleCard).join("")
            : `<div class="empty">
                No sold vehicles.
               </div>`;
}


/* ================================
   VEHICLE CARD
================================ */

function renderVehicleCard(vehicle) {

    const seller =
        getSeller(vehicle);

    const name =
        `${vehicle.make || ""} ${vehicle.model || ""}`.trim()
        || "Vehicle";

    const status =
        vehicle.status || "unknown";

    let actions = "";


    if (status === "pending") {

        actions = `

            <button
                class="action-btn approve"
                onclick="approveVehicle('${vehicle.id}')"
            >
                ✓ APPROVE & PUBLISH
            </button>

            <button
                class="action-btn delete"
                onclick="deleteVehicle('${vehicle.id}')"
            >
                Delete
            </button>
        `;
    }


    if (status === "published") {

        actions = `

            <button
                class="action-btn view"
                onclick="viewVehicle('${vehicle.listing_id || vehicle.id}')"
            >
                View
            </button>

            <button
                class="action-btn sold"
                onclick="markSold('${vehicle.id}')"
            >
                Mark Sold
            </button>

            <button
                class="action-btn feature"
                onclick="toggleFeatured(
                    '${vehicle.id}',
                    ${vehicle.featured ? "true" : "false"}
                )"
            >
                ${vehicle.featured
                    ? "Remove Feature"
                    : "Feature Vehicle"}
            </button>

            <button
                class="action-btn delete"
                onclick="deleteVehicle('${vehicle.id}')"
            >
                Delete
            </button>
        `;
    }


    if (status === "sold") {

        actions = `

            <button
                class="action-btn view"
                onclick="viewVehicle('${vehicle.listing_id || vehicle.id}')"
            >
                View
            </button>

            <button
                class="action-btn publish"
                onclick="publishAgain('${vehicle.id}')"
            >
                Publish Again
            </button>

            <button
                class="action-btn delete"
                onclick="deleteVehicle('${vehicle.id}')"
            >
                Delete
            </button>
        `;
    }


    return `

        <div class="vehicle-card">

            <div class="vehicle-grid">

                <div>

                    <img
                        src="${getVehicleImage(vehicle)}"
                        class="vehicle-image"
                        alt="${name}"
                        onerror="
                            this.src='https://via.placeholder.com/600x400?text=No+Vehicle+Photo'
                        "
                    >

                </div>


                <div class="vehicle-info">

                    <h3>
                        ${name}
                    </h3>

                    <span class="badge ${status}">
                        ${status.toUpperCase()}
                    </span>

                    <p>
                        <strong>Listing ID:</strong>
                        ${vehicle.listing_id || "N/A"}
                    </p>

                    <p>
                        <strong>Year:</strong>
                        ${vehicle.year || "N/A"}
                    </p>

                    <p>
                        <strong>Category:</strong>
                        ${vehicle.category || "N/A"}
                    </p>

                    <p>
                        <strong>Condition:</strong>
                        ${vehicle.condition || "N/A"}
                    </p>

                    <p>
                        <strong>Price:</strong>
                        ${formatPrice(vehicle.price)}
                    </p>

                    <p>
                        <strong>Location:</strong>
                        ${vehicle.location || "N/A"}
                    </p>

                    <div class="seller-box">

                        <strong>Seller / Vendor</strong>

                        <p>
                            Name:
                            ${seller.name || "N/A"}
                        </p>

                        <p>
                            Business:
                            ${seller.businessName || "N/A"}
                        </p>

                        <p>
                            Phone:
                            ${seller.phone || "N/A"}
                        </p>

                        <p>
                            Vendor ID:
                            ${vehicle.vendor_id || "N/A"}
                        </p>

                    </div>

                    <div class="actions">

                        ${actions}

                    </div>

                </div>

            </div>

        </div>
    `;
}


/* ================================
   APPROVE
================================ */

async function approveVehicle(id) {

    if (
        !confirm(
            "Approve this vehicle and publish it?"
        )
    ) {

        return;
    }

    const {
        error
    } = await supabaseClient
        .from("vehicles")
        .update({
            status: "published"
        })
        .eq("id", id);

    if (error) {

        alert(
            "Could not approve vehicle: " +
            error.message
        );

        return;
    }

    await loadVehicles();
}


/* ================================
   MARK SOLD
================================ */

async function markSold(id) {

    if (
        !confirm(
            "Mark this vehicle as SOLD?"
        )
    ) {

        return;
    }

    const {
        error
    } = await supabaseClient
        .from("vehicles")
        .update({
            status: "sold"
        })
        .eq("id", id);

    if (error) {

        alert(
            "Could not mark vehicle as sold: " +
            error.message
        );

        return;
    }

    await loadVehicles();
}


/* ================================
   PUBLISH AGAIN
================================ */

async function publishAgain(id) {

    if (
        !confirm(
            "Publish this vehicle again?"
        )
    ) {

        return;
    }

    const {
        error
    } = await supabaseClient
        .from("vehicles")
        .update({
            status: "published"
        })
        .eq("id", id);

    if (error) {

        alert(
            "Could not publish vehicle again: " +
            error.message
        );

        return;
    }

    await loadVehicles();
}


/* ================================
   FEATURE VEHICLE
================================ */

async function toggleFeatured(
    id,
    currentlyFeatured
) {

    const newValue =
        !currentlyFeatured;

    const {
        error
    } = await supabaseClient
        .from("vehicles")
        .update({
            featured: newValue
        })
        .eq("id", id);

    if (error) {

        alert(
            "Could not update featured status: " +
            error.message
        );

        return;
    }

    await loadVehicles();
}


/* ================================
   DELETE VEHICLE
================================ */

async function deleteVehicle(id) {

    if (
        !confirm(
            "Are you sure you want to permanently delete this vehicle?"
        )
    ) {

        return;
    }

    const {
        error
    } = await supabaseClient
        .from("vehicles")
        .delete()
        .eq("id", id);

    if (error) {

        alert(
            "Could not delete vehicle: " +
            error.message
        );

        return;
    }

    await loadVehicles();
}


/* ================================
   VIEW VEHICLE
================================ */

function viewVehicle(listingId) {

    if (!listingId) {

        alert("Vehicle listing ID is missing.");

        return;
    }

    window.open(
        "vehicle-details.html?id=" +
        encodeURIComponent(listingId),
        "_blank"
    );
}


/* ================================
   SEARCH
================================ */

document
    .getElementById("searchForm")
    .addEventListener(
        "submit",
        function(event) {

            event.preventDefault();

            renderVehicles();
        }
    );


document
    .getElementById("statusFilter")
    .addEventListener(
        "change",
        renderVehicles
    );


document
    .getElementById("categoryFilter")
    .addEventListener(
        "change",
        renderVehicles
    );


/* ================================
   LOGOUT
================================ */

async function logout() {

    await supabaseClient.auth.signOut();

    window.location.href =
        "admin-login.html";
}


/* ================================
   START
================================ */

async function startAdmin() {

    const authorized =
        await checkAdmin();

    if (!authorized) {

        return;
    }

    await loadVehicles();
}


startAdmin();

</script>

</body>
</html>
