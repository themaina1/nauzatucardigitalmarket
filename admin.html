<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Dashboard | Nauza Tu Digital Motor Market</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #f3f4f6;
  color: #111827;
}

header {
  background: #111827;
  color: white;
  padding: 18px 20px;
}

.header-inner {
  max-width: 1250px;
  margin: auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
}

.logo {
  font-size: 21px;
  font-weight: bold;
}

.logout-btn {
  background: #dc2626;
  color: white;
  border: none;
  padding: 10px 16px;
  border-radius: 7px;
  cursor: pointer;
  font-weight: bold;
}

.container {
  max-width: 1250px;
  margin: 30px auto;
  padding: 0 20px;
}

h1 {
  margin-bottom: 8px;
}

.subtitle {
  color: #6b7280;
  margin-bottom: 25px;
}

/* STATS */

.stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 18px;
  margin-bottom: 30px;
}

.stat {
  background: white;
  padding: 22px;
  border-radius: 10px;
  box-shadow: 0 2px 8px rgba(0,0,0,.07);
}

.stat-title {
  color: #6b7280;
  font-size: 14px;
  margin-bottom: 8px;
}

.stat-number {
  font-size: 30px;
  font-weight: bold;
}

.pending-number {
  color: #d97706;
}

.published-number {
  color: #059669;
}

.sold-number {
  color: #dc2626;
}

/* FILTER */

.filters {
  background: white;
  padding: 18px;
  border-radius: 10px;
  margin-bottom: 25px;
  display: grid;
  grid-template-columns: 2fr 1fr 1fr auto;
  gap: 10px;
}

input,
select {
  width: 100%;
  padding: 11px;
  border: 1px solid #d1d5db;
  border-radius: 7px;
  font-size: 14px;
}

.filter-btn {
  background: #111827;
  color: white;
  border: none;
  border-radius: 7px;
  padding: 11px 18px;
  cursor: pointer;
  font-weight: bold;
}

/* SECTIONS */

.section {
  margin-bottom: 35px;
}

.section-header {
  background: #111827;
  color: white;
  padding: 14px 18px;
  border-radius: 9px 9px 0 0;
  font-size: 18px;
  font-weight: bold;
}

.pending-header {
  background: #92400e;
}

.published-header {
  background: #065f46;
}

.sold-header {
  background: #991b1b;
}

.listings {
  display: grid;
  gap: 18px;
}

/* CARD */

.card {
  background: white;
  border-radius: 0 0 9px 9px;
  padding: 18px;
  box-shadow: 0 2px 8px rgba(0,0,0,.07);
}

.vehicle-top {
  display: grid;
  grid-template-columns: 220px 1fr;
  gap: 20px;
}

.vehicle-image {
  width: 220px;
  height: 165px;
  object-fit: cover;
  border-radius: 8px;
  background: #e5e7eb;
}

.vehicle-title {
  font-size: 22px;
  font-weight: bold;
  margin-bottom: 7px;
}

.price {
  color: #047857;
  font-size: 19px;
  font-weight: bold;
  margin-bottom: 12px;
}

.info-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 7px;
  font-size: 14px;
  color: #4b5563;
}

.info-grid div {
  padding: 4px 0;
}

.description {
  margin-top: 14px;
  color: #4b5563;
  line-height: 1.5;
}

.seller-box {
  background: #f9fafb;
  border: 1px solid #e5e7eb;
  padding: 13px;
  border-radius: 8px;
  margin-top: 15px;
}

.seller-box strong {
  display: block;
  margin-bottom: 5px;
}

/* BUTTONS */

.actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 18px;
  padding-top: 15px;
  border-top: 1px solid #e5e7eb;
}

.btn {
  border: none;
  border-radius: 7px;
  padding: 10px 15px;
  cursor: pointer;
  text-decoration: none;
  font-weight: bold;
  font-size: 13px;
}

.approve {
  background: #059669;
  color: white;
}

.sold {
  background: #dc2626;
  color: white;
}

.republish {
  background: #2563eb;
  color: white;
}

.delete {
  background: #7f1d1d;
  color: white;
}

.view {
  background: #111827;
  color: white;
}

.feature {
  background: #d97706;
  color: white;
}

.status-badge {
  display: inline-block;
  padding: 5px 9px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: bold;
  margin-bottom: 10px;
}

.badge-pending {
  background: #fef3c7;
  color: #92400e;
}

.badge-published {
  background: #d1fae5;
  color: #065f46;
}

.badge-sold {
  background: #fee2e2;
  color: #991b1b;
}

.featured {
  background: #fef3c7;
  color: #92400e;
  padding: 5px 9px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: bold;
}

.empty {
  background: white;
  padding: 30px;
  text-align: center;
  color: #6b7280;
  border-radius: 0 0 9px 9px;
}

.error {
  background: #fee2e2;
  color: #991b1b;
  padding: 15px;
  border-radius: 8px;
  margin-bottom: 20px;
}

.success {
  background: #d1fae5;
  color: #065f46;
  padding: 15px;
  border-radius: 8px;
  margin-bottom: 20px;
}

.loading {
  text-align: center;
  padding: 30px;
  color: #6b7280;
}

footer {
  background: #111827;
  color: white;
  text-align: center;
  padding: 30px;
  margin-top: 50px;
}

@media (max-width: 900px) {

  .stats {
    grid-template-columns: repeat(2, 1fr);
  }

  .filters {
    grid-template-columns: 1fr 1fr;
  }

  .vehicle-top {
    grid-template-columns: 180px 1fr;
  }

  .vehicle-image {
    width: 180px;
    height: 145px;
  }

  .info-grid {
    grid-template-columns: 1fr 1fr;
  }
}

@media (max-width: 600px) {

  .header-inner {
    flex-direction: column;
    align-items: flex-start;
  }

  .stats {
    grid-template-columns: 1fr 1fr;
  }

  .filters {
    grid-template-columns: 1fr;
  }

  .vehicle-top {
    grid-template-columns: 1fr;
  }

  .vehicle-image {
    width: 100%;
    height: 220px;
  }

  .info-grid {
    grid-template-columns: 1fr;
  }

  .actions {
    flex-direction: column;
  }

  .btn {
    width: 100%;
    text-align: center;
  }
}
</style>
</head>

<body>

<header>

  <div class="header-inner">

    <div class="logo">
      Nauza Tu Digital Motor Market — Admin
    </div>

    <button
      class="logout-btn"
      onclick="logout()">
      Logout
    </button>

  </div>

</header>


<div class="container">

  <h1>Administrator Dashboard</h1>

  <p class="subtitle">
    Review, approve and manage vehicle advertisements.
  </p>

  <div id="message"></div>


  <!-- STATISTICS -->

  <div class="stats">

    <div class="stat">
      <div class="stat-title">Total Vehicles</div>
      <div id="totalCount" class="stat-number">0</div>
    </div>

    <div class="stat">
      <div class="stat-title">Pending Approval</div>
      <div id="pendingCount"
           class="stat-number pending-number">
        0
      </div>
    </div>

    <div class="stat">
      <div class="stat-title">Published</div>
      <div id="publishedCount"
           class="stat-number published-number">
        0
      </div>
    </div>

    <div class="stat">
      <div class="stat-title">Sold</div>
      <div id="soldCount"
           class="stat-number sold-number">
        0
      </div>
    </div>

  </div>


  <!-- FILTERS -->

  <div class="filters">

    <input
      id="searchInput"
      type="text"
      placeholder="Search vehicle, listing ID, vendor or location..."
    >

    <select id="statusFilter">

      <option value="">
        All Statuses
      </option>

      <option value="pending">
        Pending
      </option>

      <option value="published">
        Published
      </option>

      <option value="sold">
        Sold
      </option>

    </select>


    <select id="categoryFilter">

      <option value="">
        All Categories
      </option>

      <option value="SUV">
        SUV
      </option>

      <option value="Sedan">
        Sedan
      </option>

      <option value="Hatchback">
        Hatchback
      </option>

      <option value="Van">
        Van
      </option>

      <option value="Pickup">
        Pickup
      </option>

      <option value="Wagon">
        Wagon
      </option>

      <option value="Truck">
        Truck
      </option>

    </select>


    <button
      class="filter-btn"
      onclick="applyFilters()">
      Search
    </button>

  </div>


  <!-- PENDING -->

  <div class="section">

    <div class="section-header pending-header">
      Pending Approval
    </div>

    <div
      id="pendingListings"
      class="listings">

      <div class="loading">
        Loading...
      </div>

    </div>

  </div>


  <!-- PUBLISHED -->

  <div class="section">

    <div class="section-header published-header">
      Published Vehicles
    </div>

    <div
      id="publishedListings"
      class="listings">

      <div class="loading">
        Loading...
      </div>

    </div>

  </div>


  <!-- SOLD -->

  <div class="section">

    <div class="section-header sold-header">
      Sold Vehicles
    </div>

    <div
      id="soldListings"
      class="listings">

      <div class="loading">
        Loading...
      </div>

    </div>

  </div>

</div>


<footer>

  <p>
    © 2026 Nauza Tu Digital Motor Market
  </p>

</footer>


<script>

const SUPABASE_URL =
  "https://hoogdxegjomtsvaddkwk.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_VEq6gUDlCthklOIgVUaDzQ_5TaqAsu8";

const db =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

let currentUser = null;
let allVehicles = [];


/* =========================
   START
========================= */

document.addEventListener(
  "DOMContentLoaded",
  startAdmin
);


async function startAdmin() {

  const {
    data: {
      session
    }
  } = await db.auth.getSession();


  if (!session) {

    window.location.href =
      "admin-login.html";

    return;
  }


  currentUser =
    session.user;


  /* Verify administrator */

  const {
    data: admin,
    error
  } = await db
    .from("admin_users")
    .select(
      "id,email,role,active"
    )
    .eq(
      "id",
      currentUser.id
    )
    .eq(
      "active",
      true
    )
    .maybeSingle();


  if (
    error ||
    !admin ||
    admin.role !== "admin"
  ) {

    document.body.innerHTML = `
      <div style="
        max-width:600px;
        margin:100px auto;
        padding:30px;
        text-align:center;
        font-family:Arial;
      ">

        <h2>
          This account is not authorized as an administrator.
        </h2>

        <p style="margin-top:15px;color:#666;">
          Please log in using the authorized administrator account.
        </p>

      </div>
    `;

    return;
  }


  await loadVehicles();

}


/* =========================
   LOAD VEHICLES
========================= */

async function loadVehicles() {

  try {

    const {
      data,
      error
    } = await db
      .from("vehicles")
      .select("*")
      .order(
        "created_at",
        {
          ascending: false
        }
      );


    if (error) {
      throw error;
    }


    allVehicles =
      data || [];


    updateStats();

    applyFilters();


  } catch (error) {

    console.error(error);

    showMessage(
      "Unable to load vehicle listings: " +
      error.message,
      "error"
    );

  }

}


/* =========================
   STATISTICS
========================= */

function updateStats() {

  const total =
    allVehicles.length;

  const pending =
    allVehicles.filter(
      v => v.status === "pending"
    ).length;

  const published =
    allVehicles.filter(
      v => v.status === "published"
    ).length;

  const sold =
    allVehicles.filter(
      v => v.status === "sold"
    ).length;


  document.getElementById(
    "totalCount"
  ).textContent = total;

  document.getElementById(
    "pendingCount"
  ).textContent = pending;

  document.getElementById(
    "publishedCount"
  ).textContent = published;

  document.getElementById(
    "soldCount"
  ).textContent = sold;

}


/* =========================
   FILTER
========================= */

function applyFilters() {

  const search =
    document
      .getElementById(
        "searchInput"
      )
      .value
      .trim()
      .toLowerCase();


  const status =
    document
      .getElementById(
        "statusFilter"
      )
      .value;


  const category =
    document
      .getElementById(
        "categoryFilter"
      )
      .value;


  const filtered =
    allVehicles.filter(
      vehicle => {

        const seller =
          parseSeller(
            vehicle.seller
          );


        const searchable =
          `
          ${vehicle.make || ""}
          ${vehicle.model || ""}
          ${vehicle.listing_id || ""}
          ${vehicle.location || ""}
          ${vehicle.category || ""}
          ${seller.name || ""}
          ${seller.businessName || ""}
          ${seller.phone || ""}
          ${seller.whatsapp || ""}
          `.toLowerCase();


        return (

          (!search ||
            searchable.includes(
              search
            )) &&

          (!status ||
            vehicle.status === status) &&

          (!category ||
            vehicle.category === category)

        );

      }
    );


  renderListings(
    filtered
  );

}


/* =========================
   RENDER
========================= */

function renderListings(
  vehicles
) {

  const pending =
    vehicles.filter(
      v => v.status === "pending"
    );

  const published =
    vehicles.filter(
      v => v.status === "published"
    );

  const sold =
    vehicles.filter(
      v => v.status === "sold"
    );


  renderSection(
    "pendingListings",
    pending,
    "pending"
  );

  renderSection(
    "publishedListings",
    published,
    "published"
  );

  renderSection(
    "soldListings",
    sold,
    "sold"
  );

}


/* =========================
   SECTION
========================= */

function renderSection(
  elementId,
  vehicles,
  type
) {

  const container =
    document.getElementById(
      elementId
    );


  if (!vehicles.length) {

    container.innerHTML = `
      <div class="empty">
        No ${type} vehicles.
      </div>
    `;

    return;
  }


  container.innerHTML =
    vehicles
      .map(
        vehicle =>
          vehicleCard(
            vehicle,
            type
          )
      )
      .join("");

}


/* =========================
   VEHICLE CARD
========================= */

function vehicleCard(
  vehicle,
  type
) {

  const seller =
    parseSeller(
      vehicle.seller
    );


  const image =
    vehicle.main_image ||
    "https://via.placeholder.com/600x400?text=Vehicle";


  const name =
    `${vehicle.year || ""} ${vehicle.make || ""} ${vehicle.model || ""}`
      .trim();


  const price =
    vehicle.price
      ? Number(
          vehicle.price
        ).toLocaleString()
      : "Price on request";


  const listingId =
    vehicle.listing_id ||
    vehicle.id;


  const status =
    vehicle.status ||
    "pending";


  let actions = "";


  if (type === "pending") {

    actions = `

      <button
        class="btn approve"
        onclick="approveVehicle('${vehicle.id}')">

        ✓ APPROVE & PUBLISH

      </button>


      <button
        class="btn delete"
        onclick="deleteVehicle('${vehicle.id}')">

        Delete

      </button>

    `;

  }


  if (type === "published") {

    actions = `

      <a
        class="btn view"
        href="vehicle-details.html?id=${encodeURIComponent(listingId)}"
        target="_blank">

        View

      </a>


      <button
        class="btn sold"
        onclick="markSold('${vehicle.id}')">

        Mark Sold

      </button>


      <button
        class="btn feature"
        onclick="toggleFeatured('${vehicle.id}', ${vehicle.featured === true})">

        ${vehicle.featured === true ? "Remove Feature" : "⭐ Feature"}

      </button>


      <button
        class="btn delete"
        onclick="deleteVehicle('${vehicle.id}')">

        Delete

      </button>

    `;

  }


  if (type === "sold") {

    actions = `

      <a
        class="btn view"
        href="vehicle-details.html?id=${encodeURIComponent(listingId)}"
        target="_blank">

        View

      </a>


      <button
        class="btn republish"
        onclick="republishVehicle('${vehicle.id}')">

        Publish Again

      </button>


      <button
        class="btn delete"
        onclick="deleteVehicle('${vehicle.id}')">

        Delete

      </button>

    `;

  }


  return `

    <div class="card">

      <div class="vehicle-top">

        <img
          class="vehicle-image"
          src="${escapeHtml(image)}"
          onerror="this.src='https://via.placeholder.com/600x400?text=Vehicle'"
          alt="${escapeHtml(name)}"
        >


        <div>

          <span class="status-badge badge-${escapeHtml(status)}">
            ${escapeHtml(status.toUpperCase())}
          </span>

          ${
            vehicle.featured === true
              ? `<span class="featured">⭐ FEATURED</span>`
              : ""
          }


          <div class="vehicle-title">
            ${escapeHtml(name)}
          </div>


          <div class="price">
            KES ${escapeHtml(price)}
          </div>


          <div class="info-grid">

            <div>
              <strong>Listing:</strong>
              ${escapeHtml(listingId)}
            </div>

            <div>
              <strong>Category:</strong>
              ${escapeHtml(vehicle.category || "-")}
            </div>

            <div>
              <strong>Condition:</strong>
              ${escapeHtml(vehicle.condition || "-")}
            </div>

            <div>
              <strong>Location:</strong>
              ${escapeHtml(vehicle.location || "-")}
            </div>

            <div>
              <strong>Mileage:</strong>
              ${vehicle.mileage
                ? Number(vehicle.mileage).toLocaleString() + " km"
                : "-"
              }
            </div>

            <div>
              <strong>Transmission:</strong>
              ${escapeHtml(vehicle.transmission || "-")}
            </div>

            <div>
              <strong>Fuel:</strong>
              ${escapeHtml(vehicle.fuel || "-")}
            </div>

            <div>
              <strong>Engine:</strong>
              ${escapeHtml(vehicle.engine || "-")}
            </div>

            <div>
              <strong>Drive:</strong>
              ${escapeHtml(vehicle.drive || "-")}
            </div>

          </div>

        </div>

      </div>


      ${
        vehicle.description
          ? `
            <div class="description">
              <strong>Description:</strong><br>
              ${escapeHtml(vehicle.description)}
            </div>
          `
          : ""
      }


      <div class="seller-box">

        <strong>
          Seller / Vendor
        </strong>

        ${escapeHtml(
          seller.name ||
          "Seller information unavailable"
        )}

        ${
          seller.businessName
            ? `<br>${escapeHtml(seller.businessName)}`
            : ""
        }

        ${
          seller.phone
            ? `<br>Phone: ${escapeHtml(seller.phone)}`
            : ""
        }

        ${
          seller.whatsapp
            ? `<br>WhatsApp: ${escapeHtml(seller.whatsapp)}`
            : ""
        }

      </div>


      <div class="actions">

        ${actions}

      </div>

    </div>

  `;

}


/* =========================
   APPROVE
========================= */

async function approveVehicle(
  id
) {

  if (
    !confirm(
      "Approve this vehicle and publish it to the public marketplace?"
    )
  ) {
    return;
  }


  try {

    const {
      error
    } = await db
      .from("vehicles")
      .update({
        status: "published"
      })
      .eq(
        "id",
        id
      );


    if (error) {
      throw error;
    }


    showMessage(
      "Vehicle approved and published.",
      "success"
    );


    await loadVehicles();


  } catch (error) {

    showMessage(
      "Could not publish vehicle: " +
      error.message,
      "error"
    );

  }

}


/* =========================
   MARK SOLD
========================= */

async function markSold(
  id
) {

  if (
    !confirm(
      "Mark this vehicle as SOLD?"
    )
  ) {
    return;
  }


  try {

    const {
      error
    } = await db
      .from("vehicles")
      .update({
        status: "sold"
      })
      .eq(
        "id",
        id
      );


    if (error) {
      throw error;
    }


    showMessage(
      "Vehicle marked as sold.",
      "success"
    );


    await loadVehicles();


  } catch (error) {

    showMessage(
      "Could not mark vehicle as sold: " +
      error.message,
      "error"
    );

  }

}


/* =========================
   REPUBLISH
========================= */

async function republishVehicle(
  id
) {

  if (
    !confirm(
      "Publish this vehicle again?"
    )
  ) {
    return;
  }


  try {

    const {
      error
    } = await db
      .from("vehicles")
      .update({
        status: "published"
      })
      .eq(
        "id",
        id
      );


    if (error) {
      throw error;
    }


    showMessage(
      "Vehicle published again.",
      "success"
    );


    await loadVehicles();


  } catch (error) {

    showMessage(
      "Could not republish vehicle: " +
      error.message,
      "error"
    );

  }

}


/* =========================
   FEATURE
========================= */

async function toggleFeatured(
  id,
  currentlyFeatured
) {

  try {

    const {
      error
    } = await db
      .from("vehicles")
      .update({
        featured:
          !currentlyFeatured
      })
      .eq(
        "id",
        id
      );


    if (error) {
      throw error;
    }


    showMessage(
      currentlyFeatured
        ? "Vehicle removed from Featured."
        : "Vehicle added to Featured.",
      "success"
    );


    await loadVehicles();


  } catch (error) {

    showMessage(
      "Could not change Featured status: " +
      error.message,
      "error"
    );

  }

}


/* =========================
   DELETE
========================= */

async function deleteVehicle(
  id
) {

  if (
    !confirm(
      "Delete this vehicle permanently? This cannot be undone."
    )
  ) {
    return;
  }


  try {

    const {
      error
    } = await db
      .from("vehicles")
      .delete()
      .eq(
        "id",
        id
      );


    if (error) {
      throw error;
    }


    showMessage(
      "Vehicle deleted.",
      "success"
    );


    await loadVehicles();


  } catch (error) {

    showMessage(
      "Could not delete vehicle: " +
      error.message,
      "error"
    );

  }

}


/* =========================
   SELLER PARSER
========================= */

function parseSeller(
  seller
) {

  if (!seller) {
    return {};
  }


  if (
    typeof seller === "object"
  ) {
    return seller;
  }


  try {

    return JSON.parse(
      seller
    );

  } catch (error) {

    return {};

  }

}


/* =========================
   MESSAGE
========================= */

function showMessage(
  text,
  type
) {

  const box =
    document.getElementById(
      "message"
    );


  box.innerHTML = `

    <div class="${type}">
      ${escapeHtml(text)}
    </div>

  `;


  setTimeout(
    () => {
      box.innerHTML = "";
    },
    5000
  );

}


/* =========================
   LOGOUT
========================= */

async function logout() {

  await db.auth.signOut();

  window.location.href =
    "admin-login.html";

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(
  value
) {

  if (
    value === null ||
    value === undefined
  ) {
    return "";
  }


  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================
   ENTER KEY SEARCH
========================= */

document
  .getElementById("searchInput")
  .addEventListener(
    "keydown",
    function(event) {

      if (
        event.key === "Enter"
      ) {
        applyFilters();
      }

    }
  );
