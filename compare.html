<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Compare Vehicles | Nauza Tu Digital Motor Market</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f6f5;
    color: #222;
}

header {
    background: #063d28;
    color: white;
    padding: 18px 15px;
}

.header-inner {
    max-width: 1200px;
    margin: auto;
}

header h1 {
    margin: 0;
    font-size: 24px;
}

header p {
    margin: 6px 0 0;
    font-size: 14px;
    opacity: .9;
}

nav {
    background: #042d1e;
}

.nav-inner {
    max-width: 1200px;
    margin: auto;
    padding: 10px 15px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

nav a {
    color: white;
    text-decoration: none;
    padding: 8px 12px;
    border-radius: 5px;
    font-size: 14px;
}

nav a:hover {
    background: #075638;
}

.container {
    max-width: 1200px;
    margin: 25px auto;
    padding: 0 15px;
}

.page-title {
    text-align: center;
    margin-bottom: 25px;
}

.page-title h2 {
    color: #063d28;
    margin-bottom: 8px;
}

.page-title p {
    color: #666;
    margin: 0;
}

.controls {
    background: white;
    padding: 18px;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
    margin-bottom: 20px;
}

.controls-row {
    display: grid;
    grid-template-columns: 1fr 180px;
    gap: 10px;
}

input,
select {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 14px;
}

.vehicle-selector {
    background: white;
    padding: 18px;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
    margin-bottom: 20px;
}

.vehicle-selector h3 {
    margin-top: 0;
    color: #063d28;
}

.vehicle-list {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
}

.vehicle-option {
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 12px;
    cursor: pointer;
    background: #fafafa;
}

.vehicle-option:hover {
    border-color: #063d28;
}

.vehicle-option.selected {
    border: 2px solid #063d28;
    background: #eef7f2;
}

.vehicle-option img {
    width: 100%;
    height: 130px;
    object-fit: cover;
    border-radius: 6px;
    margin-bottom: 8px;
}

.vehicle-option h4 {
    margin: 3px 0;
    color: #063d28;
}

.vehicle-option p {
    margin: 4px 0;
    font-size: 13px;
}

.compare-actions {
    margin: 20px 0;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

button {
    border: none;
    border-radius: 6px;
    padding: 11px 16px;
    cursor: pointer;
    font-weight: bold;
}

.compare-btn {
    background: #063d28;
    color: white;
}

.clear-btn {
    background: #c62828;
    color: white;
}

.compare-btn:disabled {
    background: #aaa;
    cursor: not-allowed;
}

.comparison {
    background: white;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
    overflow-x: auto;
}

.comparison table {
    width: 100%;
    border-collapse: collapse;
    min-width: 700px;
}

.comparison th,
.comparison td {
    border-bottom: 1px solid #ddd;
    padding: 13px;
    text-align: left;
    vertical-align: top;
}

.comparison th {
    background: #063d28;
    color: white;
}

.comparison td:first-child {
    font-weight: bold;
    background: #f5f7f6;
    width: 160px;
}

.compare-image {
    width: 180px;
    height: 125px;
    object-fit: cover;
    border-radius: 7px;
}

.vehicle-title {
    color: #063d28;
    font-size: 17px;
    font-weight: bold;
    margin-top: 8px;
}

.price {
    font-weight: bold;
    color: #b8860b;
}

.view-btn {
    display: inline-block;
    background: #1565c0;
    color: white;
    text-decoration: none;
    padding: 8px 12px;
    border-radius: 5px;
    font-size: 13px;
}

.loading,
.empty {
    text-align: center;
    padding: 30px;
    color: #777;
}

.message {
    display: none;
    padding: 14px;
    border-radius: 7px;
    margin-bottom: 20px;
}

.error {
    background: #ffebee;
    color: #b71c1c;
}

.success {
    background: #e8f5e9;
    color: #1b5e20;
}

footer {
    margin-top: 40px;
    background: #063d28;
    color: white;
    text-align: center;
    padding: 25px 15px;
    font-size: 13px;
}

@media (max-width: 800px) {

    .vehicle-list {
        grid-template-columns: repeat(2, 1fr);
    }

    .controls-row {
        grid-template-columns: 1fr;
    }
}

@media (max-width: 500px) {

    header h1 {
        font-size: 20px;
    }

    .vehicle-list {
        grid-template-columns: 1fr;
    }

    .vehicle-option img {
        height: 180px;
    }
}
</style>
</head>

<body>

<header>
    <div class="header-inner">
        <h1>Nauza Tu Digital Motor Market</h1>
        <p>Compare Vehicles</p>
    </div>
</header>

<nav>
    <div class="nav-inner">
        <a href="index.html">Home</a>
        <a href="vehicles.html">Vehicles</a>
        <a href="compare.html">Compare</a>
        <a href="sell.html">Sell / Advertise</a>
        <a href="contact.html">Contact</a>
    </div>
</nav>

<div class="container">

    <div class="page-title">
        <h2>Compare Vehicles</h2>
        <p>Select up to 3 published vehicles to compare their specifications.</p>
    </div>

    <div id="message" class="message"></div>

    <div class="controls">

        <div class="controls-row">

            <input
                type="text"
                id="searchInput"
                placeholder="Search make, model, year, location..."
            >

            <select id="categoryFilter">
                <option value="all">All Categories</option>
                <option value="SUV">SUV</option>
                <option value="Sedan">Sedan</option>
                <option value="Hatchback">Hatchback</option>
                <option value="Van">Van</option>
                <option value="Pickup">Pickup</option>
                <option value="Land Cruiser">Land Cruiser</option>
                <option value="Other">Other</option>
            </select>

        </div>

    </div>

    <div class="vehicle-selector">

        <h3>Select Vehicles</h3>

        <div id="vehicleList">
            <div class="loading">
                Loading published vehicles...
            </div>
        </div>

        <div class="compare-actions">

            <button
                id="compareButton"
                class="compare-btn"
                disabled
                onclick="showComparison()"
            >
                Compare Selected Vehicles
            </button>

            <button
                class="clear-btn"
                onclick="clearSelection()"
            >
                Clear Selection
            </button>

        </div>

    </div>

    <div id="comparisonContainer"></div>

</div>

<footer>
    © 2026 Nauza Tu Digital Motor Market
</footer>


<script>

const SUPABASE_URL =
    "https://hoogdxegjomtsvaddkwk.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_VEq6gUDlCthklOIgVUaDzQ_5TaqAsu8";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


let vehicles = [];

let selectedVehicles = [];


/* ================================
   SHOW MESSAGE
================================ */

function showMessage(message, type = "error") {

    const box =
        document.getElementById("message");

    box.textContent = message;

    box.className =
        "message " + type;

    box.style.display = "block";
}


/* ================================
   HIDE MESSAGE
================================ */

function hideMessage() {

    const box =
        document.getElementById("message");

    box.style.display = "none";
}


/* ================================
   LOAD PUBLISHED VEHICLES
================================ */

async function loadVehicles() {

    hideMessage();

    const {
        data,
        error
    } = await supabaseClient
        .from("vehicles")
        .select("*")
        .eq("status", "published")
        .order("created_at", {
            ascending: false
        });

    if (error) {

        console.error(error);

        showMessage(
            "Could not load vehicles: " +
            error.message
        );

        document.getElementById(
            "vehicleList"
        ).innerHTML =
            `<div class="empty">
                Unable to load vehicles.
             </div>`;

        return;
    }

    vehicles = data || [];

    renderVehicleList();
}


/* ================================
   IMAGE
================================ */

function getImage(vehicle) {

    if (
        vehicle.main_image &&
        vehicle.main_image.startsWith("http")
    ) {

        return vehicle.main_image;
    }

    if (
        vehicle.main_image &&
        vehicle.main_image.startsWith("/")
    ) {

        return vehicle.main_image;
    }

    return "https://via.placeholder.com/600x400?text=No+Vehicle+Photo";
}


/* ================================
   PRICE
================================ */

function formatPrice(price) {

    if (
        price === null ||
        price === undefined ||
        price === ""
    ) {

        return "Price on Request";
    }

    const number = Number(price);

    if (isNaN(number)) {

        return price;
    }

    return "KES " +
        number.toLocaleString();
}


/* ================================
   FILTER
================================ */

function getFilteredVehicles() {

    const search =
        document.getElementById(
            "searchInput"
        ).value
        .trim()
        .toLowerCase();

    const category =
        document.getElementById(
            "categoryFilter"
        ).value;

    return vehicles.filter(vehicle => {

        if (
            category !== "all" &&
            vehicle.category !== category
        ) {

            return false;
        }

        if (!search) {

            return true;
        }

        const text = [

            vehicle.make,
            vehicle.model,
            vehicle.year,
            vehicle.category,
            vehicle.location,
            vehicle.condition,
            vehicle.listing_id

        ]
        .filter(Boolean)
        .join(" ")
        .toLowerCase();

        return text.includes(search);
    });
}


/* ================================
   RENDER VEHICLE LIST
================================ */

function renderVehicleList() {

    const container =
        document.getElementById(
            "vehicleList"
        );

    const filtered =
        getFilteredVehicles();

    if (!filtered.length) {

        container.innerHTML =
            `<div class="empty">
                No published vehicles found.
             </div>`;

        return;
    }

    container.innerHTML = `

        <div class="vehicle-list">

            ${filtered.map(vehicle => {

                const selected =
                    selectedVehicles.includes(
                        vehicle.id
                    );

                const name =
                    `${vehicle.make || ""} ${vehicle.model || ""}`.trim();

                return `

                    <div
                        class="vehicle-option ${selected ? "selected" : ""}"
                        onclick="toggleVehicle('${vehicle.id}')"
                    >

                        <img
                            src="${getImage(vehicle)}"
                            alt="${name}"
                            onerror="
                                this.src='https://via.placeholder.com/600x400?text=No+Vehicle+Photo'
                            "
                        >

                        <h4>
                            ${name || "Vehicle"}
                        </h4>

                        <p>
                            <strong>Year:</strong>
                            ${vehicle.year || "N/A"}
                        </p>

                        <p>
                            <strong>Category:</strong>
                            ${vehicle.category || "N/A"}
                        </p>

                        <p>
                            <strong>Price:</strong>
                            ${formatPrice(vehicle.price)}
                        </p>

                        <p>
                            <strong>Location:</strong>
                            ${vehicle.location || "N/A"}
                        </p>

                        <p>
                            <strong>Listing ID:</strong>
                            ${vehicle.listing_id || "N/A"}
                        </p>

                    </div>
                `;

            }).join("")}

        </div>
    `;

    updateCompareButton();
}


/* ================================
   SELECT VEHICLE
================================ */

function toggleVehicle(id) {

    const index =
        selectedVehicles.indexOf(id);

    if (index !== -1) {

        selectedVehicles.splice(
            index,
            1
        );

    } else {

        if (selectedVehicles.length >= 3) {

            showMessage(
                "You can compare a maximum of 3 vehicles.",
                "error"
            );

            return;
        }

        selectedVehicles.push(id);
    }

    renderVehicleList();
}


/* ================================
   UPDATE BUTTON
================================ */

function updateCompareButton() {

    const button =
        document.getElementById(
            "compareButton"
        );

    button.disabled =
        selectedVehicles.length < 2;

    button.textContent =
        selectedVehicles.length >= 2
            ? `Compare ${selectedVehicles.length} Vehicles`
            : "Compare Selected Vehicles";
}


/* ================================
   CLEAR
================================ */

function clearSelection() {

    selectedVehicles = [];

    document.getElementById(
        "comparisonContainer"
    ).innerHTML = "";

    hideMessage();

    renderVehicleList();
}


/* ================================
   SHOW COMPARISON
================================ */

function showComparison() {

    if (selectedVehicles.length < 2) {

        showMessage(
            "Please select at least 2 vehicles.",
            "error"
        );

        return;
    }

    const selected =
        vehicles.filter(vehicle =>
            selectedVehicles.includes(
                vehicle.id
            )
        );

    const fields = [

        ["Vehicle", "name"],
        ["Photo", "image"],
        ["Listing ID", "listing_id"],
        ["Year", "year"],
        ["Make", "make"],
        ["Model", "model"],
        ["Category", "category"],
        ["Condition", "condition"],
        ["Price", "price"],
        ["Location", "location"],
        ["Mileage", "mileage"],
        ["Engine", "engine"],
        ["Transmission", "transmission"],
        ["Fuel", "fuel"],
        ["Drive", "drive"],
        ["Description", "description"]

    ];

    let html = `

        <div class="comparison">

            <table>

                <thead>
                    <tr>
                        <th>Specification</th>

                        ${selected.map(vehicle => `

                            <th>

                                ${vehicle.make || ""}
                                ${vehicle.model || ""}

                                <br>

                                ${vehicle.year || ""}

                            </th>

                        `).join("")}

                    </tr>
                </thead>

                <tbody>
    `;


    fields.forEach(field => {

        const label = field[0];
        const key = field[1];

        html += `
            <tr>
                <td>${label}</td>
        `;


        selected.forEach(vehicle => {

            let value = "N/A";


            if (key === "name") {

                value =
                    `${vehicle.make || ""} ${vehicle.model || ""}`.trim()
                    || "Vehicle";
            }


            else if (key === "image") {

                value = `

                    <img
                        class="compare-image"
                        src="${getImage(vehicle)}"
                        alt="Vehicle"
                    >

                `;
            }


            else if (key === "price") {

                value =
                    `<span class="price">
                        ${formatPrice(vehicle.price)}
                     </span>`;
            }


            else if (
                vehicle[key] !== null &&
                vehicle[key] !== undefined &&
                vehicle[key] !== ""
            ) {

                value =
                    escapeHtml(
                        String(vehicle[key])
                    );
            }


            html += `
                <td>
                    ${value}
                </td>
            `;
        });


        html += `</tr>`;
    });


    html += `

                    <tr>

                        <td>Vehicle Details</td>

                        ${selected.map(vehicle => `

                            <td>

                                <a
                                    class="view-btn"
                                    href="vehicle-details.html?id=${encodeURIComponent(vehicle.listing_id || vehicle.id)}"
                                >
                                    View Vehicle
                                </a>

                            </td>

                        `).join("")}

                    </tr>

                </tbody>

            </table>

        </div>
    `;


    document.getElementById(
        "comparisonContainer"
    ).innerHTML = html;


    document.getElementById(
        "comparisonContainer"
    ).scrollIntoView({
        behavior: "smooth"
    });
}


/* ================================
   ESCAPE HTML
================================ */

function escapeHtml(value) {

    return value
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* ================================
   SEARCH
================================ */

document
    .getElementById("searchInput")
    .addEventListener(
        "input",
        renderVehicleList
    );


document
    .getElementById("categoryFilter")
    .addEventListener(
        "change",
        renderVehicleList
    );


/* ================================
   START
================================ */

loadVehicles();

</script>

</body>
</html>
