<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Send Inquiry | Nauza Tu Digital Motor Market</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f7f5;
    color: #18352b;
}

header {
    background: #064d3b;
    color: white;
    padding: 18px 5%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
}

.logo {
    font-size: 27px;
    font-weight: bold;
}

.logo span {
    color: #31d98b;
}

nav {
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
}

nav a {
    color: white;
    text-decoration: none;
    font-weight: bold;
}

nav a:hover {
    color: #31d98b;
}

.container {
    width: 94%;
    max-width: 800px;
    margin: 35px auto 50px;
}

.page-title {
    text-align: center;
    margin-bottom: 25px;
}

.page-title h1 {
    color: #07543f;
    margin-bottom: 8px;
}

.page-title p {
    color: #61716b;
}

.card {
    background: white;
    border-radius: 12px;
    padding: 22px;
    margin-bottom: 20px;
    box-shadow: 0 3px 12px rgba(0,0,0,.08);
}

.card h2 {
    margin-top: 0;
    color: #07543f;
}

.vehicle-image {
    width: 100%;
    max-height: 350px;
    object-fit: cover;
    border-radius: 10px;
    margin-bottom: 18px;
    display: none;
}

.vehicle-info {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.info-item {
    padding: 10px;
    background: #f4f7f5;
    border-radius: 7px;
}

.info-label {
    font-size: 12px;
    color: #718078;
    margin-bottom: 4px;
}

.info-value {
    font-weight: bold;
    color: #18352b;
}

.form-group {
    margin-bottom: 17px;
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 7px;
}

input,
textarea {
    width: 100%;
    padding: 13px;
    border: 1px solid #ccd7d2;
    border-radius: 7px;
    font-size: 15px;
    font-family: Arial, Helvetica, sans-serif;
}

textarea {
    min-height: 140px;
    resize: vertical;
}

input:focus,
textarea:focus {
    outline: none;
    border-color: #08784f;
}

button {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 7px;
    background: #08784f;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #065c3e;
}

button:disabled {
    background: #91a69d;
    cursor: not-allowed;
}

.status {
    display: none;
    margin-top: 15px;
    padding: 14px;
    border-radius: 7px;
    line-height: 1.5;
}

.status.error {
    display: block;
    background: #ffe8e8;
    color: #a40000;
}

.status.success {
    display: block;
    background: #e6f7ed;
    color: #07543f;
}

.loading {
    text-align: center;
    color: #61716b;
    padding: 15px;
}

footer {
    background: #064d3b;
    color: white;
    text-align: center;
    padding: 22px;
}

@media (max-width: 600px) {

    header {
        flex-direction: column;
        text-align: center;
    }

    nav {
        justify-content: center;
        font-size: 14px;
    }

    .vehicle-info {
        grid-template-columns: 1fr;
    }

    .container {
        margin-top: 25px;
    }
}
</style>
</head>

<body>

<header>

    <div class="logo">
        🚗 Nauza <span>Tu</span>
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="vehicles.html">Vehicles</a>
        <a href="compare.html">Compare</a>
        <a href="sell.html">Sell / Advertise</a>
        <a href="contact.html">Contact</a>
    </nav>

</header>


<main class="container">

    <div class="page-title">
        <h1>Send Inquiry</h1>
        <p>Contact the registered vendor directly on WhatsApp.</p>
    </div>


    <!-- VEHICLE -->

    <div class="card">

        <div id="loadingVehicle" class="loading">
            Loading vehicle...
        </div>

        <img
            id="vehicleImage"
            class="vehicle-image"
            alt="Vehicle"
        >

        <div id="vehicleContent" style="display:none;">

            <h2 id="vehicleName"></h2>

            <div class="vehicle-info">

                <div class="info-item">
                    <div class="info-label">
                        Listing ID
                    </div>
                    <div
                        class="info-value"
                        id="listingId"
                    ></div>
                </div>

                <div class="info-item">
                    <div class="info-label">
                        Price
                    </div>
                    <div
                        class="info-value"
                        id="vehiclePrice"
                    ></div>
                </div>

                <div class="info-item">
                    <div class="info-label">
                        Year
                    </div>
                    <div
                        class="info-value"
                        id="vehicleYear"
                    ></div>
                </div>

                <div class="info-item">
                    <div class="info-label">
                        Location
                    </div>
                    <div
                        class="info-value"
                        id="vehicleLocation"
                    ></div>
                </div>

                <div class="info-item">
                    <div class="info-label">
                        Vendor
                    </div>
                    <div
                        class="info-value"
                        id="vendorName"
                    ></div>
                </div>

            </div>

        </div>

    </div>


    <!-- INQUIRY -->

    <div
        class="card"
        id="formCard"
        style="display:none;"
    >

        <h2>Your Inquiry</h2>

        <form id="inquiryForm">

            <div class="form-group">

                <label for="name">
                    Your Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your name"
                    required
                >

            </div>


            <div class="form-group">

                <label for="phone">
                    Your Phone Number
                </label>

                <input
                    type="tel"
                    id="phone"
                    placeholder="e.g. 0712345678"
                    required
                >

            </div>


            <div class="form-group">

                <label for="message">
                    Your Inquiry
                </label>

                <textarea
                    id="message"
                    required
                >Hello, I am interested in this vehicle. Please let me know if it is still available.</textarea>

            </div>


            <button
                type="submit"
                id="sendButton"
            >
                Send Inquiry on WhatsApp
            </button>


            <div
                id="status"
                class="status"
            ></div>

        </form>

    </div>

</main>


<footer>
    © 2026 Nauza Tu Digital Motor Market
    | Find Your Next Ride Today
</footer>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://hoogdxegjomtsvaddkwk.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_VEq6gUDlCthklOIgVUaDzQ_5TaqAsu8";

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================================
   PAGE VARIABLES
========================================================= */

let currentVehicle = null;
let currentVendor = null;


/* =========================================================
   GET URL PARAMETERS
========================================================= */

const urlParams =
    new URLSearchParams(
        window.location.search
    );

const idParameter =
    urlParams.get("id");

const listingParameter =
    urlParams.get("listing_id");


/* =========================================================
   FORMAT PRICE
========================================================= */

function formatPrice(price) {

    if (
        price === null ||
        price === undefined ||
        price === ""
    ) {
        return "Price on Request";
    }

    const number =
        Number(price);

    if (Number.isNaN(number)) {
        return price;
    }

    return (
        "KES " +
        number.toLocaleString("en-KE")
    );
}


/* =========================================================
   WHATSAPP NUMBER
   Same Kenyan number normalization
   used by the working vehicle enquiry.
========================================================= */

function normalizeWhatsApp(number) {

    if (!number) {
        return "";
    }

    let value =
        String(number)
        .trim()
        .replace(/\s+/g, "")
        .replace(/-/g, "")
        .replace(/\(/g, "")
        .replace(/\)/g, "");

    if (value.startsWith("+")) {
        value =
            value.substring(1);
    }

    if (value.startsWith("07")) {

        value =
            "254" +
            value.substring(1);

    } else if (
        value.startsWith("01")
    ) {

        value =
            "254" +
            value.substring(1);

    } else if (
        value.startsWith("7") &&
        value.length === 9
    ) {

        value =
            "254" +
            value;

    } else if (
        value.startsWith("1") &&
        value.length === 9
    ) {

        value =
            "254" +
            value;

    }

    return value;
}


/* =========================================================
   LOAD VEHICLE
========================================================= */

async function loadVehicle() {

    const loading =
        document.getElementById(
            "loadingVehicle"
        );

    try {

        let vehicle = null;


        /*
           FIRST:
           If id is supplied, try UUID.
        */

        if (idParameter) {

            let result =
                await supabaseClient
                .from("vehicles")
                .select("*")
                .eq("id", idParameter)
                .eq("status", "published")
                .maybeSingle();

            if (
                !result.error &&
                result.data
            ) {

                vehicle =
                    result.data;

            }


            /*
               If not UUID, try listing_id.
            */

            if (!vehicle) {

                result =
                    await supabaseClient
                    .from("vehicles")
                    .select("*")
                    .eq(
                        "listing_id",
                        idParameter
                    )
                    .eq(
                        "status",
                        "published"
                    )
                    .maybeSingle();

                if (
                    !result.error &&
                    result.data
                ) {

                    vehicle =
                        result.data;

                }

            }

        }


        /*
           SECOND:
           Try listing_id parameter.
        */

        if (
            !vehicle &&
            listingParameter
        ) {

            const result =
                await supabaseClient
                .from("vehicles")
                .select("*")
                .eq(
                    "listing_id",
                    listingParameter
                )
                .eq(
                    "status",
                    "published"
                )
                .maybeSingle();

            if (
                !result.error &&
                result.data
            ) {

                vehicle =
                    result.data;

            }

        }


        if (!vehicle) {

            loading.innerHTML = `
                <strong>Vehicle not found.</strong><br><br>
                Please open the inquiry page
                from the vehicle's Enquire button.
            `;

            return;

        }


        currentVehicle =
            vehicle;


        /*
           Display vehicle.
        */

        displayVehicle(vehicle);


        /*
           IMPORTANT:
           Get vendor using vendor_id.
        */

        if (
            vehicle.vendor_id
        ) {

            const vendorResult =
                await supabaseClient
                .from("vendor_profiles")
                .select(
                    "id, full_name, phone, whatsapp, business_name"
                )
                .eq(
                    "id",
                    vehicle.vendor_id
                )
                .maybeSingle();


            if (
                !vendorResult.error &&
                vendorResult.data
            ) {

                currentVendor =
                    vendorResult.data;

            }

        }


        /*
           If vendor profile was not found,
           fall back to the seller data
           stored inside the vehicle.
        */

        if (!currentVendor) {

            let sellerData =
                vehicle.seller;


            if (
                typeof sellerData === "string"
            ) {

                try {

                    sellerData =
                        JSON.parse(
                            sellerData
                        );

                } catch (e) {

                    sellerData = {};

                }

            }


            currentVendor = {

                id: vehicle.vendor_id || null,

                full_name:
                    sellerData?.name ||
                    "Vehicle Seller",

                business_name:
                    sellerData?.businessName ||
                    "",

                phone:
                    sellerData?.phone ||
                    "",

                whatsapp:
                    sellerData?.whatsapp ||
                    ""

            };

        }


        /*
           Show form.
        */

        document.getElementById(
            "formCard"
        ).style.display =
            "block";


        loading.style.display =
            "none";

    }

    catch (error) {

        console.error(
            "Vehicle loading error:",
            error
        );

        loading.innerHTML = `
            <strong>Unable to load vehicle.</strong><br><br>
            Please go back to the vehicle listing
            and tap Enquire again.
        `;

    }

}


/* =========================================================
   DISPLAY VEHICLE
========================================================= */

function displayVehicle(vehicle) {

    const name =
        `${vehicle.make || ""} ${vehicle.model || ""}`
        .trim();


    document.getElementById(
        "vehicleName"
    ).textContent =
        name || "Vehicle";


    document.getElementById(
        "listingId"
    ).textContent =
        vehicle.listing_id ||
        vehicle.id ||
        "—";


    document.getElementById(
        "vehiclePrice"
    ).textContent =
        formatPrice(
            vehicle.price
        );


    document.getElementById(
        "vehicleYear"
    ).textContent =
        vehicle.year ||
        "—";


    document.getElementById(
        "vehicleLocation"
    ).textContent =
        vehicle.location ||
        "Kenya";


    document.getElementById(
        "vendorName"
    ).textContent =
        "Registered Vendor";


    /*
       Use main_image if available.
    */

    if (
        vehicle.main_image &&
        (
            vehicle.main_image.startsWith(
                "http://"
            ) ||
            vehicle.main_image.startsWith(
                "https://"
            )
        )
    ) {

        const image =
            document.getElementById(
                "vehicleImage"
            );

        image.src =
            vehicle.main_image;

        image.style.display =
            "block";

    }


    document.getElementById(
        "vehicleContent"
    ).style.display =
        "block";

}


/* =========================================================
   SEND INQUIRY
========================================================= */

document
.getElementById("inquiryForm")
.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const button =
            document.getElementById(
                "sendButton"
            );

        const status =
            document.getElementById(
                "status"
            );


        status.className =
            "status";

        status.textContent =
            "";


        if (!currentVehicle) {

            status.className =
                "status error";

            status.textContent =
                "Vehicle information has not loaded. Please go back and tap Enquire again.";

            return;

        }


        if (!currentVendor) {

            status.className =
                "status error";

            status.textContent =
                "The registered vendor could not be found for this vehicle.";

            return;

        }


        const name =
            document.getElementById(
                "name"
            ).value.trim();


        const phone =
            document.getElementById(
                "phone"
            ).value.trim();


        const inquiry =
            document.getElementById(
                "message"
            ).value.trim();


        /*
           EXACT VENDOR ROUTING:
           Prefer vendor_profiles.whatsapp,
           then vendor_profiles.phone,
           then stored seller details.
        */

        let vendorNumber =
            currentVendor.whatsapp ||
            currentVendor.phone ||
            "";


        /*
           Final fallback to vehicle seller.
        */

        if (!vendorNumber) {

            let sellerData =
                currentVehicle.seller;


            if (
                typeof sellerData === "string"
            ) {

                try {

                    sellerData =
                        JSON.parse(
                            sellerData
                        );

                } catch (e) {

                    sellerData = {};

                }

            }


            vendorNumber =
                sellerData?.whatsapp ||
                sellerData?.phone ||
                "";

        }


        vendorNumber =
            normalizeWhatsApp(
                vendorNumber
            );


        if (!vendorNumber) {

            status.className =
                "status error";

            status.textContent =
                "This vendor does not have a WhatsApp number registered yet.";

            return;

        }


        const vehicleName =
            `${currentVehicle.make || ""} ${currentVehicle.model || ""}`
            .trim();


        const listingId =
            currentVehicle.listing_id ||
            currentVehicle.id ||
            "";


        const price =
            formatPrice(
                currentVehicle.price
            );


        /*
           WhatsApp message.
        */

        const whatsappMessage =
`Hello, I am interested in the vehicle listed on Nauza Tu Digital Motor Market.

Vehicle: ${vehicleName}
Listing ID: ${listingId}
Price: ${price}

My name: ${name}
My phone: ${phone}

My inquiry:
${inquiry}`;


        const whatsappURL =
            "https://wa.me/" +
            vendorNumber +
            "?text=" +
            encodeURIComponent(
                whatsappMessage
            );


        button.disabled =
            true;

        button.textContent =
            "Opening WhatsApp...";


        /*
           Open WhatsApp directly.
        */

        window.location.href =
            whatsappURL;

    }
);


/* =========================================================
   START PAGE
========================================================= */

loadVehicle();

</script>

</body>
</html>
