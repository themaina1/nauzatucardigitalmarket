<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Send Inquiry | Nauza Tu Digital Motor Market</title>

<meta name="description"
content="Send an inquiry about a vehicle listed on Nauza Tu Digital Motor Market.">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f7f5;
    color: #18352b;
}

/* HEADER */

header {
    background: #064d3b;
    color: white;
    padding: 18px 5%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
}

.logo {
    font-size: 27px;
    font-weight: bold;
}

.logo span {
    color: #31d98b;
}

nav {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
}

nav a {
    color: white;
    text-decoration: none;
    font-weight: bold;
}

nav a:hover {
    color: #31d98b;
}

/* MAIN */

.container {
    width: 94%;
    max-width: 800px;
    margin: 40px auto;
}

.page-title {
    text-align: center;
    margin-bottom: 25px;
}

.page-title h1 {
    color: #07543f;
    margin-bottom: 8px;
}

.page-title p {
    color: #61716b;
}

/* VEHICLE INFORMATION */

.vehicle-box {
    background: white;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 3px 12px rgba(0,0,0,.08);
}

.vehicle-box h2 {
    margin-top: 0;
    color: #07543f;
}

.vehicle-info {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    color: #586961;
}

/* FORM */

.form-box {
    background: white;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 3px 12px rgba(0,0,0,.08);
}

.form-group {
    margin-bottom: 17px;
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 7px;
}

input,
textarea {
    width: 100%;
    padding: 13px;
    border: 1px solid #ccd7d2;
    border-radius: 7px;
    font-size: 15px;
    font-family: Arial, Helvetica, sans-serif;
}

textarea {
    min-height: 140px;
    resize: vertical;
}

input:focus,
textarea:focus {
    outline: none;
    border-color: #08784f;
}

/* BUTTON */

button {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 7px;
    background: #08784f;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #065c3e;
}

button:disabled {
    background: #91a69d;
    cursor: not-allowed;
}

/* STATUS */

.status {
    margin-top: 18px;
    padding: 14px;
    border-radius: 7px;
    display: none;
    line-height: 1.5;
}

.status.error {
    display: block;
    background: #ffe8e8;
    color: #a40000;
}

.status.success {
    display: block;
    background: #e6f7ed;
    color: #07543f;
}

/* FOOTER */

footer {
    background: #064d3b;
    color: white;
    text-align: center;
    padding: 22px;
    margin-top: 50px;
}

/* MOBILE */

@media (max-width: 600px) {

    header {
        flex-direction: column;
        text-align: center;
    }

    nav {
        justify-content: center;
        font-size: 14px;
    }

    .vehicle-info {
        grid-template-columns: 1fr;
    }

    .container {
        margin-top: 25px;
    }

}

</style>
</head>


<body>


<header>

    <div class="logo">
        🚗 Nauza <span>Tu</span>
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="vehicles.html">Vehicles</a>
        <a href="compare.html">Compare</a>
        <a href="sell.html">Sell / Advertise</a>
        <a href="contact.html">Contact</a>
    </nav>

</header>


<main class="container">


    <div class="page-title">

        <h1>
            Send Inquiry
        </h1>

        <p>
            Contact the seller directly about this vehicle.
        </p>

    </div>


    <!-- VEHICLE DETAILS -->

    <div
        class="vehicle-box"
        id="vehicleBox"
    >

        <h2 id="vehicleName">
            Loading vehicle...
        </h2>

        <div
            class="vehicle-info"
            id="vehicleInfo"
        >
        </div>

    </div>


    <!-- INQUIRY FORM -->

    <div class="form-box">

        <form
            id="inquiryForm"
        >

            <div class="form-group">

                <label for="name">
                    Your Name
                </label>

                <input
                    type="text"
                    id="name"
                    required
                    placeholder="Enter your name"
                >

            </div>


            <div class="form-group">

                <label for="phone">
                    Your Phone Number
                </label>

                <input
                    type="tel"
                    id="phone"
                    required
                    placeholder="e.g. 0712345678"
                >

            </div>


            <div class="form-group">

                <label for="message">
                    Your Inquiry
                </label>

                <textarea
                    id="message"
                    required
                    placeholder="I am interested in this vehicle. Please let me know if it is still available."
                ></textarea>

            </div>


            <button
                type="submit"
                id="sendButton"
            >
                Send Inquiry
            </button>


            <div
                id="status"
                class="status"
            ></div>

        </form>

    </div>

</main>


<footer>

    © 2026 Nauza Tu Digital Motor Market
    | Find Your Next Ride Today

</footer>


<script>

/* ==================================================
   SUPABASE
================================================== */

const SUPABASE_URL =
    "https://hoogdxegjomtsvaddkwk.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_VEq6gUDlCthklOIgVUaDzQ_5TaqAsu8";

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* ==================================================
   GET VEHICLE ID FROM URL
================================================== */

const params =
    new URLSearchParams(
        window.location.search
    );

const vehicleId =
    params.get("id");


let currentVehicle = null;
let seller = null;


/* ==================================================
   NORMALIZE WHATSAPP
================================================== */

function normalizeWhatsApp(number) {

    if (!number) {
        return "";
    }

    let value =
        String(number)
        .replace(/\s+/g, "")
        .replace(/-/g, "");

    if (value.startsWith("+")) {
        value =
            value.substring(1);
    }

    if (value.startsWith("07")) {

        value =
            "254" +
            value.substring(1);

    }

    if (
        value.startsWith("7") &&
        value.length === 9
    ) {

        value =
            "254" +
            value;

    }

    return value;
}


/* ==================================================
   PARSE SELLER
================================================== */

function parseSeller(vehicle) {

    if (!vehicle.seller) {

        return {
            name: "Private Seller",
            phone: "",
            whatsapp: ""
        };

    }

    try {

        if (
            typeof vehicle.seller === "string"
        ) {

            return JSON.parse(
                vehicle.seller
            );

        }

        return vehicle.seller;

    }

    catch (error) {

        return {
            name: "Private Seller",
            phone: "",
            whatsapp: ""
        };

    }

}


/* ==================================================
   LOAD VEHICLE
================================================== */

async function loadVehicle() {

    const nameElement =
        document.getElementById(
            "vehicleName"
        );

    const infoElement =
        document.getElementById(
            "vehicleInfo"
        );


    if (!vehicleId) {

        nameElement.textContent =
            "Vehicle Inquiry";

        infoElement.innerHTML = `
            <div>
                Please open this page
                from a vehicle listing.
            </div>
        `;

        return;

    }


    /*
       Try listing_id first.
    */

    let result =
        await supabaseClient
        .from("vehicles")
        .select("*")
        .eq(
            "listing_id",
            vehicleId
        )
        .eq(
            "status",
            "published"
        )
        .maybeSingle();


    /*
       If not found, try UUID.
    */

    if (
        result.error ||
        !result.data
    ) {

        result =
            await supabaseClient
            .from("vehicles")
            .select("*")
            .eq(
                "id",
                vehicleId
            )
            .eq(
                "status",
                "published"
            )
            .maybeSingle();

    }


    if (
        result.error ||
        !result.data
    ) {

        nameElement.textContent =
            "Vehicle Not Found";

        infoElement.innerHTML = `
            <div>
                This vehicle listing
                could not be found.
            </div>
        `;

        return;

    }


    currentVehicle =
        result.data;


    seller =
        parseSeller(
            currentVehicle
        );


    const vehicleName =
        `${currentVehicle.make || ""} ${
            currentVehicle.model || ""
        }`
        .trim();


    nameElement.textContent =
        vehicleName ||
        "Vehicle";


    infoElement.innerHTML = `

        <div>
            <strong>Listing ID:</strong>
            ${
                currentVehicle.listing_id ||
                currentVehicle.id ||
                "—"
            }
        </div>


        <div>
            <strong>Year:</strong>
            ${
                currentVehicle.year ||
                "—"
            }
        </div>


        <div>
            <strong>Category:</strong>
            ${
                currentVehicle.category ||
                "—"
            }
        </div>


        <div>
            <strong>Price:</strong>
            ${
                currentVehicle.price
                ?
                "KES " +
                Number(
                    currentVehicle.price
                ).toLocaleString("en-KE")
                :
                "Price on Request"
            }
        </div>


        <div>
            <strong>Location:</strong>
            ${
                currentVehicle.location ||
                "Kenya"
            }
        </div>


        <div>
            <strong>Seller:</strong>
            ${
                seller.name ||
                "Private Seller"
            }
        </div>

    `;

}


/* ==================================================
   SEND INQUIRY
================================================== */

document
.getElementById("inquiryForm")
.addEventListener(
    "submit",
    function(event) {

        event.preventDefault();


        const status =
            document.getElementById(
                "status"
            );

        const button =
            document.getElementById(
                "sendButton"
            );


        status.className =
            "status";

        status.style.display =
            "none";


        if (!currentVehicle) {

            status.className =
                "status error";

            status.textContent =
                "Vehicle information is not available. Please return to the vehicle listing and try again.";

            return;

        }


        const name =
            document.getElementById(
                "name"
            ).value.trim();


        const phone =
            document.getElementById(
                "phone"
            ).value.trim();


        const userMessage =
            document.getElementById(
                "message"
            ).value.trim();


        const sellerNumber =
            normalizeWhatsApp(
                seller.whatsapp ||
                seller.phone ||
                currentVehicle.whatsapp ||
                currentVehicle.phone
            );


        if (!sellerNumber) {

            status.className =
                "status error";

            status.textContent =
                "This seller does not currently have a WhatsApp number registered. Please use the vehicle details page to contact the seller.";

            return;

        }


        const vehicleName =
            `${currentVehicle.make || ""} ${
                currentVehicle.model || ""
            }`
            .trim();


        const listingId =
            currentVehicle.listing_id ||
            currentVehicle.id ||
            "";


        const price =
            currentVehicle.price
            ?
            Number(
                currentVehicle.price
            ).toLocaleString(
                "en-KE"
            )
            :
            "Price on Request";


        /*
           Message sent directly
           to the registered seller.
        */

        const whatsappMessage =

`Hello ${seller.name || "Seller"},

My name is ${name}.
My phone number is ${phone}.

I am interested in your vehicle listed on Nauza Tu Digital Motor Market.

Vehicle: ${vehicleName}
Listing ID: ${listingId}
Price: KES ${price}

My inquiry:
${userMessage}

Please let me know if the vehicle is still available.`;


        const whatsappURL =
            `https://wa.me/${sellerNumber}?text=${
                encodeURIComponent(
                    whatsappMessage
                )
            }`;


        button.disabled =
            true;

        button.textContent =
            "Opening WhatsApp...";


        /*
           Open WhatsApp.
        */

        window.location.href =
            whatsappURL;

    }
);


/* ==================================================
   START
================================================== */

loadVehicle();

</script>

</body>
</html>
