<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Reset Password | Nauza Tu Digital Motor Market</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    font-family: Arial, Helvetica, sans-serif;

    background: #f4f6f8;

    padding: 20px;
}

.card {
    width: 100%;
    max-width: 430px;

    background: white;

    padding: 35px;

    border-radius: 15px;

    box-shadow:
        0 10px 35px rgba(0,0,0,0.15);
}

h1 {
    text-align: center;

    margin: 0 0 10px;

    color: #111827;
}

.subtitle {
    text-align: center;

    color: #6b7280;

    font-size: 14px;

    margin-bottom: 25px;

    line-height: 1.5;
}

label {
    display: block;

    margin-bottom: 7px;

    font-weight: bold;

    color: #374151;
}

input {
    width: 100%;

    padding: 14px;

    border: 1px solid #d1d5db;

    border-radius: 8px;

    font-size: 16px;

    margin-bottom: 18px;
}

input:focus {
    outline: none;

    border-color: #111827;
}

button {
    width: 100%;

    padding: 14px;

    border: none;

    border-radius: 8px;

    background: #111827;

    color: white;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;
}

button:disabled {
    opacity: 0.6;

    cursor: not-allowed;
}

.message {
    margin-top: 18px;

    padding: 12px;

    border-radius: 8px;

    text-align: center;

    font-size: 14px;

    line-height: 1.5;
}

.success {
    background: #dcfce7;

    color: #166534;
}

.error {
    background: #fee2e2;

    color: #991b1b;
}

.login-link {
    display: block;

    text-align: center;

    margin-top: 20px;

    color: #374151;

    text-decoration: none;

    font-weight: bold;

    font-size: 14px;
}

.hidden {
    display: none;
}

</style>
</head>

<body>

<div class="card">

    <h1>
        Reset Password
    </h1>

    <div class="subtitle">
        Create a new password for your
        Nauza Tu administrator account.
    </div>


    <form id="resetForm">

        <label for="password">
            New Password
        </label>

        <input
            type="password"
            id="password"
            placeholder="Enter new password"
            minlength="6"
            required
        >


        <label for="confirmPassword">
            Confirm Password
        </label>

        <input
            type="password"
            id="confirmPassword"
            placeholder="Enter password again"
            minlength="6"
            required
        >


        <button
            type="submit"
            id="resetButton"
        >
            Change Password
        </button>

    </form>


    <div
        id="message"
        class="message hidden"
    ></div>


    <a
        href="admin-login.html"
        class="login-link"
    >
        ← Back to Admin Login
    </a>

</div>


<script>

/* =====================================================
   SUPABASE CONFIGURATION
   ===================================================== */

const SUPABASE_URL =
    "https://hoogdxegjomtsvaddkwk.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_VEq6gUDlCthklOIgVUaDzQ_5TaqAsu8";


/* =====================================================
   CREATE SUPABASE CLIENT
   ===================================================== */

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


/* =====================================================
   ELEMENTS
   ===================================================== */

const form =
    document.getElementById("resetForm");

const password =
    document.getElementById("password");

const confirmPassword =
    document.getElementById("confirmPassword");

const button =
    document.getElementById("resetButton");

const message =
    document.getElementById("message");


/* =====================================================
   SHOW MESSAGE
   ===================================================== */

function showMessage(text, type) {

    message.textContent = text;

    message.className =
        "message " + type;

}


/* =====================================================
   HANDLE RECOVERY SESSION
   ===================================================== */

async function prepareRecoverySession() {

    try {

        /*
         * Supabase password recovery links can contain
         * the access token in the URL hash.
         */

        const hash =
            window.location.hash.substring(1);


        if (hash) {

            const params =
                new URLSearchParams(hash);


            const accessToken =
                params.get("access_token");

            const refreshToken =
                params.get("refresh_token");

            const type =
                params.get("type");


            /*
             * If this is a recovery link, establish
             * the Supabase session manually.
             */

            if (
                accessToken &&
                refreshToken
            ) {

                const {
                    error
                } =
                    await supabaseClient.auth.setSession(
                        {
                            access_token:
                                accessToken,

                            refresh_token:
                                refreshToken
                        }
                    );


                if (error) {

                    console.error(
                        "Recovery session error:",
                        error
                    );


                    showMessage(
                        "This password reset link is invalid or has expired. Please request a new reset email.",
                        "error"
                    );

                    form.classList.add(
                        "hidden"
                    );

                    return false;

                }

            }

        }


        /*
         * Confirm that a valid session now exists.
         */

        const {
            data,
            error
        } =
            await supabaseClient.auth.getSession();


        if (error) {

            console.error(
                "Session error:",
                error
            );


            showMessage(
                "Unable to verify the password reset session.",
                "error"
            );

            form.classList.add(
                "hidden"
            );

            return false;

        }


        if (!data.session) {

            showMessage(
                "This password reset link is invalid or has expired. Please request a new reset email.",
                "error"
            );

            form.classList.add(
                "hidden"
            );

            return false;

        }


        /*
         * A valid recovery session exists.
         */

        console.log(
            "Password recovery session ready."
        );


        return true;


    } catch (error) {

        console.error(
            "Recovery preparation error:",
            error
        );


        showMessage(
            "Unable to prepare the password reset. Please request a new reset email.",
            "error"
        );

        form.classList.add(
            "hidden"
        );

        return false;

    }

}


/* =====================================================
   CHANGE PASSWORD
   ===================================================== */

form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const newPassword =
            password.value;

        const confirm =
            confirmPassword.value;


        if (
            newPassword.length < 6
        ) {

            showMessage(
                "Password must be at least 6 characters.",
                "error"
            );

            return;

        }


        if (
            newPassword !== confirm
        ) {

            showMessage(
                "The passwords do not match.",
                "error"
            );

            return;

        }


        button.disabled =
            true;

        button.textContent =
            "Changing Password...";


        try {

            /*
             * Make absolutely sure the recovery
             * session still exists.
             */

            const {
                data: sessionData
            } =
                await supabaseClient.auth.getSession();


            if (
                !sessionData ||
                !sessionData.session
            ) {

                throw new Error(
                    "Auth session missing"
                );

            }


            /*
             * Update the password.
             */

            const {
                error
            } =
                await supabaseClient.auth.updateUser(
                    {
                        password:
                            newPassword
                    }
                );


            if (error) {

                throw error;

            }


            showMessage(
                "Password changed successfully! You can now log in with your new password.",
                "success"
            );


            form.classList.add(
                "hidden"
            );


            /*
             * Sign out the recovery session.
             */

            await supabaseClient.auth.signOut();


        } catch (error) {

            console.error(
                "Password update error:",
                error
            );


            showMessage(
                error.message ||
                "Unable to change your password.",
                "error"
            );


            button.disabled =
                false;

            button.textContent =
                "Change Password";

        }

    }
);


/* =====================================================
   START
   ===================================================== */

prepareRecoverySession();

</script>

</body>
</html>
