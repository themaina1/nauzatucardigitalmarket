<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Reset Admin Password | Nauza Tu Digital Motor Market</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.12);
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
      color: #111;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: none;
      border-radius: 7px;
      background: #111;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    #message {
      margin-top: 18px;
      text-align: center;
      font-weight: bold;
    }

    .success {
      color: green;
    }

    .error {
      color: red;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>Reset Password</h1>

    <div class="subtitle">
      Create a new Admin password
    </div>

    <form id="resetForm">

      <label for="password">
        New Password
      </label>

      <input
        type="password"
        id="password"
        placeholder="Enter new password"
        minlength="6"
        required
      >

      <label for="confirmPassword">
        Confirm Password
      </label>

      <input
        type="password"
        id="confirmPassword"
        placeholder="Enter password again"
        minlength="6"
        required
      >

      <button type="submit">
        Change Password
      </button>

    </form>

    <div id="message"></div>

  </div>

<script>

  /* SUPABASE CONNECTION */

  const SUPABASE_URL =
    "https://hookdyegjomtsvaddkwk.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_VEq6gUDlCthklOIgVUaDzQ_5TaqAsu8";


  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


  /* PASSWORD RESET */

  const resetForm =
    document.getElementById("resetForm");

  const message =
    document.getElementById("message");


  resetForm.addEventListener("submit", async function(event) {

    event.preventDefault();

    const password =
      document.getElementById("password").value;

    const confirmPassword =
      document.getElementById("confirmPassword").value;


    if (password !== confirmPassword) {

      message.textContent =
        "Passwords do not match.";

      message.className = "error";

      return;
    }


    if (password.length < 6) {

      message.textContent =
        "Password must be at least 6 characters.";

      message.className = "error";

      return;
    }


    message.textContent =
      "Changing password...";

    message.className = "";


    const { data, error } =
      await supabaseClient.auth.updateUser({
        password: password
      });


    if (error) {

      message.textContent =
        error.message;

      message.className = "error";

      return;
    }


    message.textContent =
      "Password changed successfully! You can now log in.";

    message.className = "success";


    resetForm.reset();

  });

</script>

</body>
</html>
