<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vehicles for Sale | Nauza Tu Digital Motor Market</title>

<meta name="description"
content="Browse vehicles for sale from trusted sellers across Kenya on Nauza Tu Digital Motor Market.">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f5f7f6;
    color: #18352b;
}

/* HEADER */

header {
    background: #064d3b;
    color: white;
    padding: 18px 5%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
}

.logo {
    font-size: 27px;
    font-weight: bold;
}

.logo span {
    color: #31d98b;
}

nav {
    display: flex;
    gap: 22px;
    flex-wrap: wrap;
}

nav a {
    color: white;
    text-decoration: none;
    font-weight: bold;
}

nav a:hover,
nav a.active {
    color: #31d98b;
}

/* HERO */

.hero {
    text-align: center;
    padding: 35px 20px 20px;
}

.hero h1 {
    margin: 0 0 8px;
    font-size: 38px;
    color: #07543f;
}

.hero p {
    margin: 0;
    color: #52645d;
    font-size: 17px;
}

/* CATEGORY CARDS */

.categories {
    width: 94%;
    max-width: 1500px;
    margin: 20px auto 30px;
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 14px;
}

.category-card {
    background: white;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 3px 12px rgba(0,0,0,.10);
    cursor: pointer;
    transition: .2s;
}

.category-card:hover {
    transform: translateY(-4px);
}

.category-card img {
    width: 100%;
    height: 160px;
    object-fit: cover;
    display: block;
}

.category-title {
    background: #07543f;
    color: white;
    text-align: center;
    padding: 12px 5px;
    font-size: 17px;
    font-weight: bold;
}

/* SEARCH */

.search-box {
    width: 94%;
    max-width: 1450px;
    margin: 0 auto 25px;
    background: white;
    padding: 18px;
    border-radius: 12px;
    box-shadow: 0 3px 12px rgba(0,0,0,.08);

    display: grid;
    grid-template-columns: 2fr 1fr 1fr 120px;
    gap: 12px;
}

.search-box input,
.search-box select {
    width: 100%;
    padding: 13px;
    border: 1px solid #d4ddd9;
    border-radius: 7px;
    font-size: 15px;
}

.search-box button {
    border: none;
    border-radius: 7px;
    background: #08784f;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

.search-box button:hover {
    background: #065c3e;
}

/* RESULTS */

.results {
    width: 94%;
    max-width: 1450px;
    margin: 0 auto 30px;
}

.results-count {
    font-size: 17px;
    margin-bottom: 15px;
    font-weight: bold;
}

.vehicle-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 18px;
}

.vehicle-card {
    background: white;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 3px 12px rgba(0,0,0,.10);
}

.vehicle-image {
    position: relative;
    height: 220px;
    background: #e9efec;
}

.vehicle-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

.badge {
    position: absolute;
    top: 10px;
    left: 10px;
    background: #08784f;
    color: white;
    padding: 6px 9px;
    border-radius: 5px;
    font-size: 12px;
    font-weight: bold;
}

.featured {
    left: auto;
    right: 10px;
    background: #e2a900;
}

.vehicle-content {
    padding: 14px;
}

.vehicle-content h3 {
    margin: 0 0 7px;
    font-size: 19px;
    color: #17382d;
}

.price {
    color: #d58b00;
    font-size: 19px;
    font-weight: bold;
    margin-bottom: 12px;
}

.specs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    font-size: 13px;
    color: #586961;
}

.location {
    margin-top: 10px;
    font-size: 13px;
    color: #53655e;
}

.seller {
    margin-top: 7px;
    font-size: 13px;
    color: #53655e;
}

.actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 14px;
}

.actions a {
    text-align: center;
    padding: 10px 6px;
    border-radius: 6px;
    text-decoration: none;
    color: white;
    font-size: 13px;
    font-weight: bold;
}

.view-btn {
    background: #0874d1;
}

.whatsapp-btn {
    background: #08784f;
}

.no-results {
    background: white;
    padding: 35px;
    text-align: center;
    border-radius: 10px;
    color: #66756f;
}

/* FOOTER */

footer {
    background: #064d3b;
    color: white;
    text-align: center;
    padding: 22px;
    margin-top: 40px;
    font-size: 14px;
}

/* TABLET */

@media (max-width: 1100px) {

    .categories {
        grid-template-columns: repeat(3, 1fr);
    }

    .vehicle-grid {
        grid-template-columns: repeat(2, 1fr);
    }

    .search-box {
        grid-template-columns: 1fr 1fr;
    }
}

/* MOBILE */

@media (max-width: 650px) {

    header {
        flex-direction: column;
        text-align: center;
    }

    nav {
        justify-content: center;
        gap: 13px;
        font-size: 14px;
    }

    .hero h1 {
        font-size: 29px;
    }

    .categories {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
    }

    .category-card img {
        height: 125px;
    }

    .category-title {
        font-size: 14px;
    }

    .search-box {
        grid-template-columns: 1fr;
    }

    .vehicle-grid {
        grid-template-columns: 1fr;
    }

    .vehicle-image {
        height: 240px;
    }
}
</style>
</head>

<body>

<header>

    <div class="logo">
        🚗 Nauza <span>Tu</span>
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="vehicles.html" class="active">Vehicles</a>
        <a href="compare.html">Compare</a>
        <a href="sell.html">Sell / Advertise</a>
        <a href="contact.html">Contact</a>
    </nav>

</header>


<section class="hero">

    <h1>Vehicles for Sale</h1>

    <p>
        Browse vehicles from sellers across Kenya.
    </p>

</section>


<!-- ==================================================
     KENYAN VEHICLE CATEGORIES
     These photos are stored directly in the repository.
================================================== -->

<section class="categories">

    <div class="category-card"
         onclick="selectCategory('SUV')">

        <img
            src="suv.jpg"
            alt="SUV vehicles for sale in Kenya"
            onerror="this.style.display='none'"
        >

        <div class="category-title">
            SUV
        </div>

    </div>


    <div class="category-card"
         onclick="selectCategory('Sedan')">

        <img
            src="sedans.jpg"
            alt="Sedan vehicles for sale in Kenya"
            onerror="this.style.display='none'"
        >

        <div class="category-title">
            Sedans
        </div>

    </div>


    <div class="category-card"
         onclick="selectCategory('Hatchback')">

        <img
            src="hatchbacks.jpg"
            alt="Hatchback vehicles for sale in Kenya"
            onerror="this.style.display='none'"
        >

        <div class="category-title">
            Hatchbacks
        </div>

    </div>


    <div class="category-card"
         onclick="selectCategory('Van')">

        <img
            src="vans.jpg"
            alt="Van vehicles for sale in Kenya"
            onerror="this.style.display='none'"
        >

        <div class="category-title">
            Vans
        </div>

    </div>


    <div class="category-card"
         onclick="selectCategory('Pickup')">

        <img
            src="pickups.jpg"
            alt="Pickup vehicles for sale in Kenya"
            onerror="this.style.display='none'"
        >

        <div class="category-title">
            Pickups
        </div>

    </div>


    <div class="category-card"
         onclick="selectCategory('Land Cruiser')">

        <img
            src="land-cruisers.jpg"
            alt="Land Cruiser vehicles for sale in Kenya"
            onerror="this.style.display='none'"
        >

        <div class="category-title">
            Land Cruisers
        </div>

    </div>

</section>


<!-- SEARCH -->

<section class="search-box">

    <input
        type="text"
        id="searchInput"
        placeholder="Search make, model, location or listing ID..."
    >


    <select id="categoryFilter">

        <option value="">
            All Categories
        </option>

        <option value="SUV">
            SUV
        </option>

        <option value="Sedan">
            Sedan
        </option>

        <option value="Hatchback">
            Hatchback
        </option>

        <option value="Van">
            Van
        </option>

        <option value="Pickup">
            Pickup
        </option>

        <option value="Land Cruiser">
            Land Cruiser
        </option>

    </select>


    <select id="sortFilter">

        <option value="newest">
            Newest
        </option>

        <option value="oldest">
            Oldest
        </option>

        <option value="price-low">
            Price: Low to High
        </option>

        <option value="price-high">
            Price: High to Low
        </option>

    </select>


    <button onclick="loadVehicles()">
        Search
    </button>

</section>


<!-- VEHICLE RESULTS -->

<section class="results">

    <div
        class="results-count"
        id="resultsCount"
    >
        Loading vehicles...
    </div>


    <div
        id="vehicleGrid"
        class="vehicle-grid"
    ></div>

</section>


<footer>

    © 2026 Nauza Tu Digital Motor Market
    |
    Find Your Next Ride Today

</footer>


<script>

/* ==================================================
   SUPABASE
================================================== */

const SUPABASE_URL =
    "https://hoogdxegjomtsvaddkwk.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_VEq6gUDlCthklOIgVUaDzQ_5TaqAsu8";

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* ==================================================
   CATEGORY SELECTION
================================================== */

function selectCategory(category) {

    document.getElementById(
        "categoryFilter"
    ).value = category;

    loadVehicles();

    setTimeout(function() {

        document.querySelector(
            ".results"
        ).scrollIntoView({
            behavior: "smooth"
        });

    }, 100);

}


/* ==================================================
   WHATSAPP NUMBER
================================================== */

function normalizeWhatsApp(number) {

    if (!number) {
        return "";
    }

    let value =
        String(number)
        .replace(/\s+/g, "")
        .replace(/-/g, "");

    if (value.startsWith("+")) {
        value = value.substring(1);
    }

    if (value.startsWith("07")) {

        value =
            "254" +
            value.substring(1);

    }

    if (
        value.startsWith("7") &&
        value.length === 9
    ) {

        value =
            "254" +
            value;

    }

    return value;
}


/* ==================================================
   VEHICLE IMAGE
================================================== */

function getVehicleImage(vehicle) {

    /*
       First priority:
       Supabase public image URL.
    */

    if (
        vehicle.main_image &&
        String(vehicle.main_image)
            .startsWith("http")
    ) {

        return vehicle.main_image;

    }


    /*
       Check the images array.
    */

    if (vehicle.images) {

        try {

            let images =
                vehicle.images;

            if (
                typeof images === "string"
            ) {

                images =
                    JSON.parse(images);

            }


            if (
                Array.isArray(images) &&
                images.length > 0
            ) {

                for (
                    let image of images
                ) {

                    if (
                        typeof image === "string" &&
                        image.startsWith("http")
                    ) {

                        return image;

                    }

                }

            }

        }

        catch (error) {

            console.log(
                "Image parsing error:",
                error
            );

        }

    }


    /*
       Legacy image path.
    */

    if (vehicle.main_image) {

        return vehicle.main_image;

    }


    /*
       Last fallback.
    */

    return "";

}


/* ==================================================
   SELLER INFORMATION
================================================== */

function getSeller(vehicle) {

    if (!vehicle.seller) {

        return {
            name: "Private Seller",
            phone: "",
            whatsapp: ""
        };

    }


    try {

        if (
            typeof vehicle.seller === "string"
        ) {

            return JSON.parse(
                vehicle.seller
            );

        }

        return vehicle.seller;

    }

    catch (error) {

        return {
            name: "Private Seller",
            phone: "",
            whatsapp: ""
        };

    }

}


/* ==================================================
   LOAD VEHICLES
================================================== */

async function loadVehicles() {

    const grid =
        document.getElementById(
            "vehicleGrid"
        );

    const count =
        document.getElementById(
            "resultsCount"
        );


    grid.innerHTML = "";

    count.textContent =
        "Loading vehicles...";


    const search =
        document.getElementById(
            "searchInput"
        )
        .value
        .toLowerCase()
        .trim();


    const category =
        document.getElementById(
            "categoryFilter"
        )
        .value;


    const sort =
        document.getElementById(
            "sortFilter"
        )
        .value;


    const {
        data,
        error
    } =
        await supabaseClient
        .from("vehicles")
        .select("*")
        .eq(
            "status",
            "published"
        );


    if (error) {

        console.error(error);

        count.textContent =
            "Unable to load vehicles.";

        grid.innerHTML = `
            <div class="no-results">
                There was a problem loading vehicles.
                Please try again.
            </div>
        `;

        return;

    }


    let vehicles =
        data || [];


    /* SEARCH */

    if (search) {

        vehicles =
            vehicles.filter(
                vehicle => {

                    const text = [

                        vehicle.listing_id,
                        vehicle.make,
                        vehicle.model,
                        vehicle.category,
                        vehicle.location,
                        vehicle.year

                    ]
                    .join(" ")
                    .toLowerCase();


                    return text.includes(
                        search
                    );

                }
            );

    }


    /* CATEGORY */

    if (category) {

        vehicles =
            vehicles.filter(
                vehicle => {

                    return String(
                        vehicle.category || ""
                    )
                    .toLowerCase()
                    .includes(
                        category.toLowerCase()
                    );

                }
            );

    }


    /* SORT */

    if (sort === "newest") {

        vehicles.sort(
            (a, b) =>
                new Date(
                    b.created_at || 0
                ) -
                new Date(
                    a.created_at || 0
                )
        );

    }


    else if (sort === "oldest") {

        vehicles.sort(
            (a, b) =>
                new Date(
                    a.created_at || 0
                ) -
                new Date(
                    b.created_at || 0
                )
        );

    }


    else if (sort === "price-low") {

        vehicles.sort(
            (a, b) =>
                Number(
                    a.price || 0
                ) -
                Number(
                    b.price || 0
                )
        );

    }


    else if (sort === "price-high") {

        vehicles.sort(
            (a, b) =>
                Number(
                    b.price || 0
                ) -
                Number(
                    a.price || 0
                )
        );

    }


    count.textContent =
        `Showing ${vehicles.length} vehicle${
            vehicles.length === 1
            ? ""
            : "s"
        }`;


    if (vehicles.length === 0) {

        grid.innerHTML = `
            <div class="no-results">
                No vehicles found matching
                your search.
            </div>
        `;

        return;

    }


    vehicles.forEach(
        vehicle => {

            grid.appendChild(
                createVehicleCard(
                    vehicle
                )
            );

        }
    );

}


/* ==================================================
   CREATE VEHICLE CARD
================================================== */

function createVehicleCard(vehicle) {

    const card =
        document.createElement(
            "article"
        );

    card.className =
        "vehicle-card";


    const image =
        getVehicleImage(
            vehicle
        );


    const seller =
        getSeller(
            vehicle
        );


    const listingId =
        vehicle.listing_id ||
        vehicle.id ||
        "";


    const vehicleName =
        `${vehicle.make || ""} ${
            vehicle.model || ""
        }`
        .trim();


    const price =
        vehicle.price
        ? Number(
            vehicle.price
          ).toLocaleString(
              "en-KE"
          )
        : "";


    const whatsapp =
        normalizeWhatsApp(
            seller.whatsapp ||
            seller.phone ||
            vehicle.whatsapp ||
            vehicle.phone
        );


    const message =
        `Hello, I am interested in the ${
            vehicleName
        } listed on Nauza Tu Digital Motor Market.` +
        ` Listing ID: ${
            listingId
        }.` +
        (
            vehicle.price
            ?
            ` Price: KES ${
                Number(
                    vehicle.price
                ).toLocaleString(
                    "en-KE"
                )
            }.`
            :
            ""
        ) +
        ` Please let me know if the vehicle is still available.`;


    const whatsappLink =
        whatsapp
        ?
        `https://wa.me/${
            whatsapp
        }?text=${
            encodeURIComponent(
                message
            )
        }`
        :
        `vehicle-details.html?id=${
            encodeURIComponent(
                listingId
            )
        }`;


    const featured =
        vehicle.featured === true;


    card.innerHTML = `

        <div class="vehicle-image">

            ${
                image
                ?
                `
                <img
                    src="${image}"
                    alt="${vehicleName}"
                    loading="lazy"
                    onerror="
                        this.style.display='none';
                        this.parentElement.style.background='#e9efec';
                    "
                >
                `
                :
                `
                <div style="
                    height:100%;
                    display:flex;
                    align-items:center;
                    justify-content:center;
                    color:#7b8a84;
                    font-size:15px;
                ">
                    Vehicle Photo
                </div>
                `
            }


            <div class="badge">
                AVAILABLE
            </div>


            ${
                featured
                ?
                `
                <div class="badge featured">
                    FEATURED
                </div>
                `
                :
                ""
            }

        </div>


        <div class="vehicle-content">

            <h3>
                ${
                    vehicleName ||
                    "Vehicle"
                }
            </h3>


            <div class="price">

                ${
                    vehicle.price
                    ?
                    `KES ${price}`
                    :
                    "Price on Request"
                }

            </div>


            <div class="specs">

                <div>
                    📅 ${
                        vehicle.year ||
                        "—"
                    }
                </div>


                <div>
                    🚙 ${
                        vehicle.category ||
                        "—"
                    }
                </div>


                <div>
                    🛣️ ${
                        vehicle.mileage
                        ?
                        Number(
                            vehicle.mileage
                        ).toLocaleString() +
                        " km"
                        :
                        "—"
                    }
                </div>


                <div>
                    ⛽ ${
                        vehicle.fuel ||
                        "—"
                    }
                </div>


                <div>
                    ⚙️ ${
                        vehicle.transmission ||
                        "—"
                    }
                </div>


                <div>
                    🔧 ${
                        vehicle.engine ||
                        "—"
                    }
                </div>

            </div>


            <div class="location">

                📍 ${
                    vehicle.location ||
                    "Kenya"
                }

            </div>


            <div class="seller">

                👤 ${
                    seller.name ||
                    "Private Seller"
                }

            </div>


            <div class="actions">


                <a
                    class="view-btn"
                    href="vehicle-details.html?id=${
                        encodeURIComponent(
                            listingId
                        )
                    }"
                >
                    View Details
                </a>


                ${
                    whatsapp
                    ?
                    `
                    <a
                        class="whatsapp-btn"
                        href="${whatsappLink}"
                        target="_blank"
                        rel="noopener"
                    >
                        WhatsApp
                    </a>
                    `
                    :
                    `
                    <a
                        class="whatsapp-btn"
                        href="vehicle-details.html?id=${
                            encodeURIComponent(
                                listingId
                            )
                        }"
                    >
                        Enquire
                    </a>
                    `
                }

            </div>

        </div>

    `;


    return card;

}


/* ==================================================
   SEARCH EVENTS
================================================== */

document
.getElementById(
    "searchInput"
)
.addEventListener(
    "input",
    function() {

        clearTimeout(
            window.searchTimer
        );

        window.searchTimer =
            setTimeout(
                loadVehicles,
                250
            );

    }
);


document
.getElementById(
    "categoryFilter"
)
.addEventListener(
    "change",
    loadVehicles
);


document
.getElementById(
    "sortFilter"
)
.addEventListener(
    "change",
    loadVehicles
);


/* ==================================================
   START PAGE
================================================== */

loadVehicles();

</script>

</body>
</html>
