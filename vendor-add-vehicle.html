<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Add Vehicle | Nauza Tu Digital Motor Market</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f6f8;
    color:#222;
}

header{
    background:#111827;
    color:white;
    padding:16px 20px;
}

.header-inner{
    max-width:1000px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
}

.logo{
    font-size:20px;
    font-weight:bold;
}

.logo span{
    color:#f4b400;
}

header a{
    background:white;
    color:#111827;
    text-decoration:none;
    padding:9px 13px;
    border-radius:7px;
    font-weight:bold;
    font-size:14px;
}

.container{
    max-width:1000px;
    margin:25px auto;
    padding:0 15px;
}

.card{
    background:white;
    padding:25px;
    border-radius:12px;
    box-shadow:0 2px 9px rgba(0,0,0,.08);
}

h1{
    margin-bottom:8px;
}

.intro{
    color:#666;
    margin-bottom:25px;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
}

.full{
    grid-column:1 / -1;
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:6px;
    font-size:14px;
}

input,
select,
textarea{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:7px;
    font-size:15px;
    background:white;
}

textarea{
    min-height:130px;
    resize:vertical;
}

input:focus,
select:focus,
textarea:focus{
    outline:none;
    border-color:#f4b400;
}

.photo-box{
    border:2px dashed #bbb;
    padding:20px;
    border-radius:10px;
    background:#fafafa;
}

.photo-box input{
    border:0;
    padding:0;
    background:none;
}

.photo-note{
    margin-top:8px;
    color:#666;
    font-size:13px;
}

.preview{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    margin-top:15px;
}

.preview img{
    width:100%;
    height:110px;
    object-fit:cover;
    border-radius:7px;
    background:#ddd;
}

.submit-area{
    margin-top:25px;
    text-align:center;
}

button{
    border:0;
    cursor:pointer;
    padding:14px 25px;
    border-radius:8px;
    background:#f4b400;
    color:#111;
    font-size:16px;
    font-weight:bold;
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.message{
    margin-top:15px;
    padding:12px;
    border-radius:7px;
    display:none;
    font-size:14px;
}

.success{
    display:block;
    background:#d8f5e3;
    color:#08753b;
}

.error{
    display:block;
    background:#f8d7da;
    color:#842029;
}

.required{
    color:#dc3545;
}

@media(max-width:700px){

    .header-inner{
        flex-direction:column;
        align-items:flex-start;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .full{
        grid-column:auto;
    }

    .preview{
        grid-template-columns:repeat(2,1fr);
    }

    .card{
        padding:18px;
    }
}
</style>
</head>

<body>

<header>

<div class="header-inner">

    <div class="logo">
        Nauza Tu <span>Digital Motor Market</span>
    </div>

    <a href="vendor-dashboard.html">
        Back to Dashboard
    </a>

</div>

</header>


<main class="container">

<div class="card">

<h1>Add Vehicle</h1>

<p class="intro">
Submit your vehicle for review. Your listing will be checked by Nauza Tu before it appears on the public marketplace.
</p>


<form id="vehicleForm">

<div class="form-grid">


<div>
<label>
Listing ID
</label>

<input
    type="text"
    id="listingId"
    readonly
    placeholder="Generating..."
>
</div>


<div>
<label>
Make <span class="required">*</span>
</label>

<input
    type="text"
    id="make"
    required
    placeholder="e.g. Toyota"
>
</div>


<div>
<label>
Model <span class="required">*</span>
</label>

<input
    type="text"
    id="model"
    required
    placeholder="e.g. Harrier"
>
</div>


<div>
<label>
Year <span class="required">*</span>
</label>

<input
    type="number"
    id="year"
    required
    min="1900"
    max="2100"
    placeholder="e.g. 2019"
>
</div>


<div>
<label>
Category <span class="required">*</span>
</label>

<select id="category" required>

<option value="">
Select category
</option>

<option value="SUV">
SUV
</option>

<option value="Sedan">
Sedan
</option>

<option value="Hatchback">
Hatchback
</option>

<option value="Van">
Van
</option>

<option value="Pickup">
Pickup
</option>

<option value="Land Cruiser">
Land Cruiser
</option>

<option value="Other">
Other
</option>

</select>
</div>


<div>
<label>
Condition <span class="required">*</span>
</label>

<select id="condition" required>

<option value="">
Select condition
</option>

<option value="Used">
Used
</option>

<option value="New">
New
</option>

<option value="Foreign Used">
Foreign Used
</option>

</select>
</div>


<div>
<label>
Price (KES) <span class="required">*</span>
</label>

<input
    type="number"
    id="price"
    required
    min="0"
    placeholder="e.g. 2500000"
>
</div>


<div>
<label>
Location <span class="required">*</span>
</label>

<input
    type="text"
    id="location"
    required
    placeholder="e.g. Nairobi"
>
</div>


<div>
<label>
Mileage (km)
</label>

<input
    type="number"
    id="mileage"
    min="0"
    placeholder="e.g. 72000"
>
</div>


<div>
<label>
Engine
</label>

<input
    type="text"
    id="engine"
    placeholder="e.g. 2.0L"
>
</div>


<div>
<label>
Transmission
</label>

<select id="transmission">

<option value="">
Select
</option>

<option value="Automatic">
Automatic
</option>

<option value="Manual">
Manual
</option>

<option value="CVT">
CVT
</option>

</select>
</div>


<div>
<label>
Fuel
</label>

<select id="fuel">

<option value="">
Select
</option>

<option value="Petrol">
Petrol
</option>

<option value="Diesel">
Diesel
</option>

<option value="Hybrid">
Hybrid
</option>

<option value="Electric">
Electric
</option>

</select>
</div>


<div>
<label>
Drive
</label>

<select id="drive">

<option value="">
Select
</option>

<option value="2WD">
2WD
</option>

<option value="4WD">
4WD
</option>

<option value="AWD">
AWD
</option>

</select>
</div>


<div class="full">

<label>
Vehicle Photos <span class="required">*</span>
</label>

<div class="photo-box">

<input
    type="file"
    id="photos"
    accept="image/*"
    multiple
    required
>

<p class="photo-note">
Select one or more clear photos of the vehicle. The first photo will be used as the main image.
</p>

<div
    id="preview"
    class="preview">
</div>

</div>

</div>


<div class="full">

<label>
Description
</label>

<textarea
    id="description"
    placeholder="Describe the vehicle, ownership, condition, features, service history, etc."
></textarea>

</div>


<div class="full">

<label>
Contact Preference</label>

<select id="publicContact">

<option value="true">
Allow buyers to contact me directly
</option>

<option value="false">
Do not display my direct contact
</option>

</select>

</div>


</div>


<div class="submit-area">

<button
    type="submit"
    id="submitButton">

Submit Vehicle for Review

</button>

<div
    id="message"
    class="message">
</div>

</div>

</form>

</div>

</main>


<script>

const SUPABASE_URL =
"https://hoogdxegjomtsvaddkwk.supabase.co";

const SUPABASE_KEY =
"sb_publishable_VEq6gUDlCthklOIgVUaDzQ_5TaqAsu8";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


let currentUser = null;
let currentProfile = null;


/* =========================
   INITIALIZE
========================= */

document.addEventListener(
    "DOMContentLoaded",
    initialize
);


async function initialize(){

    const {
        data: { session },
        error
    } =
    await supabaseClient.auth.getSession();


    if(error || !session){

        window.location.href =
            "vendor-login.html";

        return;

    }


    currentUser =
        session.user;


    await loadProfile();

    generateListingId();

}


/* =========================
   PROFILE
========================= */

async function loadProfile(){

    const {
        data,
        error
    } =
    await supabaseClient
        .from("vendor_profiles")
        .select("*")
        .eq("id", currentUser.id)
        .maybeSingle();


    if(error){

        console.error(error);

        showMessage(
            "Could not load your vendor profile.",
            "error"
        );

        return;

    }


    currentProfile =
        data || {};

}


/* =========================
   LISTING ID
========================= */

function generateListingId(){

    const random =
        Math.floor(
            10000 +
            Math.random() * 90000
        );


    document.getElementById(
        "listingId"
    ).value =
        "NT-" +
        new Date().getFullYear() +
        "-" +
        random;

}


/* =========================
   PHOTO PREVIEW
========================= */

document.getElementById(
    "photos"
).addEventListener(
    "change",
    function(){

        const preview =
            document.getElementById(
                "preview"
            );


        preview.innerHTML = "";


        Array.from(this.files)
        .forEach(file => {

            if(!file.type.startsWith("image/"))
                return;


            const reader =
                new FileReader();


            reader.onload =
                function(e){

                    const img =
                        document.createElement(
                            "img"
                        );

                    img.src =
                        e.target.result;

                    preview.appendChild(img);

                };


            reader.readAsDataURL(file);

        });

    }
);


/* =========================
   SUBMIT
========================= */

document.getElementById(
    "vehicleForm"
).addEventListener(
    "submit",
    submitVehicle
);


async function submitVehicle(event){

    event.preventDefault();


    const submitButton =
        document.getElementById(
            "submitButton"
        );


    submitButton.disabled = true;

    submitButton.textContent =
        "Uploading photos and submitting...";


    hideMessage();


    try{

        if(!currentUser){

            throw new Error(
                "Your login session has expired. Please login again."
            );

        }


        const files =
            Array.from(
                document.getElementById(
                    "photos"
                ).files
            );


        if(!files.length){

            throw new Error(
                "Please select at least one vehicle photo."
            );

        }


        const listingId =
            document.getElementById(
                "listingId"
            ).value.trim();


        const imageUrls = [];


        /* =========================
           UPLOAD PHOTOS
        ========================= */

        for(
            let i = 0;
            i < files.length;
            i++
        ){

            const file =
                files[i];


            if(!file.type.startsWith("image/")){

                throw new Error(
                    "Only image files are allowed."
                );

            }


            const extension =
                file.name
                .split(".")
                .pop()
                .toLowerCase();


            const uniqueName =
                Date.now() +
                "-" +
                i +
                "-" +
                Math.random()
                .toString(36)
                .substring(2,8) +
                "." +
                extension;


            const filePath =
                currentUser.id +
                "/" +
                listingId +
                "/" +
                uniqueName;


            const {
                error: uploadError
            } =
            await supabaseClient
                .storage
                .from("vehicle-images")
                .upload(
                    filePath,
                    file,
                    {
                        cacheControl:"3600",
                        upsert:false
                    }
                );


            if(uploadError){

                throw uploadError;

            }


            const {
                data: publicData
            } =
            supabaseClient
                .storage
                .from("vehicle-images")
                .getPublicUrl(
                    filePath
                );


            if(
                !publicData ||
                !publicData.publicUrl
            ){

                throw new Error(
                    "Could not create public photo URL."
                );

            }


            imageUrls.push(
                publicData.publicUrl
            );

        }


        /* =========================
           SELLER INFORMATION
        ========================= */

        const seller = {

            name:
                currentProfile.full_name ||
                currentUser.email ||
                "Vendor",

            type:
                currentProfile.business_name
                ? "Motor Dealer"
                : "Private Seller",

            phone:
                currentProfile.phone ||
                "",

            whatsapp:
                currentProfile.whatsapp ||
                currentProfile.phone ||
                "",

            publicContact:
                document.getElementById(
                    "publicContact"
                ).value === "true"

        };


        /* =========================
           PAYMENT INFORMATION
        ========================= */

        const payment = {

            date:"",
            amount:0,
            status:"Not Applicable — Free Listing",
            transactionCode:""

        };


        /* =========================
           VEHICLE DATA
        ========================= */

        const vehicleData = {

            listing_id:
                listingId,

            vendor_id:
                currentUser.id,

            make:
                document.getElementById(
                    "make"
                ).value.trim(),

            model:
                document.getElementById(
                    "model"
                ).value.trim(),

            year:
                Number(
                    document.getElementById(
                        "year"
                    ).value
                ),

            category:
                document.getElementById(
                    "category"
                ).value,

            condition:
                document.getElementById(
                    "condition"
                ).value,

            price:
                Number(
                    document.getElementById(
                        "price"
                    ).value
                ),

            location:
                document.getElementById(
                    "location"
                ).value.trim(),

            mileage:
                document.getElementById(
                    "mileage"
                ).value
                ? Number(
                    document.getElementById(
                        "mileage"
                    ).value
                )
                : null,

            engine:
                document.getElementById(
                    "engine"
                ).value.trim(),

            transmission:
                document.getElementById(
                    "transmission"
                ).value,

            fuel:
                document.getElementById(
                    "fuel"
                ).value,

            drive:
                document.getElementById(
                    "drive"
                ).value,

            main_image:
                imageUrls[0],

            images:
                imageUrls,

            description:
                document.getElementById(
                    "description"
                ).value.trim(),

            featured:
                false,

            promotion:
                "Free Listing",

            featured_until:
                null,

            seller:
                seller,

            payment:
                payment,

            /*
             * IMPORTANT:
             * New listings wait for admin approval.
             */
            status:
                "pending"

        };


        /* =========================
           INSERT VEHICLE
        ========================= */

        const {
            data,
            error
        } =
        await supabaseClient
            .from("vehicles")
            .insert(
                vehicleData
            )
            .select()
            .single();


        if(error){

            console.error(error);

            throw error;

        }


        showMessage(
            "Vehicle submitted successfully. Your listing is now PENDING ADMIN APPROVAL.",
            "success"
        );


        submitButton.textContent =
            "Submitted for Review";


        document.getElementById(
            "vehicleForm"
        ).reset();


        document.getElementById(
            "preview"
        ).innerHTML = "";


        generateListingId();


        setTimeout(
            function(){

                window.location.href =
                    "vendor-dashboard.html";

            },
            2500
        );


    }catch(error){

        console.error(
            "Vehicle submission error:",
            error
        );


        showMessage(
            "Could not submit vehicle: " +
            (error.message || error),
            "error"
        );


        submitButton.disabled = false;

        submitButton.textContent =
            "Submit Vehicle for Review";

    }

}


/* =========================
   MESSAGE
========================= */

function showMessage(
    text,
    type
){

    const message =
        document.getElementById(
            "message"
        );


    message.textContent =
        text;


    message.className =
        "message " +
        type;

}


function hideMessage(){

    const message =
        document.getElementById(
            "message"
        );


    message.className =
        "message";


    message.textContent =
        "";

}

</script>

</body>
</html>
