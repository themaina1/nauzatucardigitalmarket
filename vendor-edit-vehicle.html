<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Edit Vehicle | Nauza Tu Digital Motor Market</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f7fa;
    color:#1f2937;
}

header{
    background:#111827;
    color:white;
}

.navbar{
    max-width:1100px;
    margin:auto;
    padding:16px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
}

.logo{
    color:#facc15;
    font-size:22px;
    font-weight:bold;
    text-decoration:none;
}

.nav-links{
    display:flex;
    gap:15px;
    flex-wrap:wrap;
}

.nav-links a{
    color:white;
    text-decoration:none;
    font-size:14px;
    font-weight:bold;
}

.nav-links a:hover{
    color:#facc15;
}

.container{
    max-width:900px;
    margin:35px auto;
    padding:0 20px;
}

.page-heading{
    margin-bottom:25px;
}

.page-heading h1{
    font-size:32px;
    color:#111827;
    margin-bottom:8px;
}

.page-heading p{
    color:#667085;
}

.form-card{
    background:white;
    padding:30px;
    border-radius:12px;
    box-shadow:0 4px 18px rgba(0,0,0,.08);
}

.section-title{
    font-size:20px;
    font-weight:bold;
    color:#111827;
    margin:25px 0 15px;
    padding-bottom:8px;
    border-bottom:1px solid #e5e7eb;
}

.section-title:first-child{
    margin-top:0;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
}

.form-group{
    margin-bottom:4px;
}

.form-group.full{
    grid-column:1/-1;
}

label{
    display:block;
    font-size:14px;
    font-weight:bold;
    margin-bottom:7px;
    color:#374151;
}

.required{
    color:#dc2626;
}

input,
select,
textarea{
    width:100%;
    padding:12px;
    border:1px solid #d1d5db;
    border-radius:7px;
    background:white;
    font-family:inherit;
    font-size:15px;
}

input:focus,
select:focus,
textarea:focus{
    outline:none;
    border-color:#2563eb;
    box-shadow:0 0 0 2px rgba(37,99,235,.1);
}

textarea{
    min-height:120px;
    resize:vertical;
}

.help{
    margin-top:6px;
    color:#6b7280;
    font-size:12px;
}

.vehicle-id-box{
    background:#eff6ff;
    border:1px solid #bfdbfe;
    padding:14px;
    border-radius:8px;
    margin-bottom:20px;
    font-size:14px;
    color:#1e3a8a;
}

.message{
    display:none;
    padding:15px;
    border-radius:7px;
    margin-bottom:20px;
    line-height:1.5;
}

.message.success{
    display:block;
    background:#dcfce7;
    color:#166534;
    border-left:5px solid #16a34a;
}

.message.error{
    display:block;
    background:#fee2e2;
    color:#991b1b;
    border-left:5px solid #dc2626;
}

.button-row{
    display:flex;
    gap:12px;
    margin-top:30px;
}

button,
.button-link{
    border:none;
    padding:13px 20px;
    border-radius:7px;
    font-weight:bold;
    font-size:15px;
    cursor:pointer;
    text-decoration:none;
    text-align:center;
}

.save-button{
    background:#16a34a;
    color:white;
    flex:1;
}

.save-button:hover{
    background:#15803d;
}

.cancel-button{
    background:#e5e7eb;
    color:#111827;
}

.loading{
    text-align:center;
    padding:50px;
    color:#667085;
}

.spinner{
    width:36px;
    height:36px;
    border:4px solid #e5e7eb;
    border-top-color:#16a34a;
    border-radius:50%;
    margin:0 auto 15px;
    animation:spin .8s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

.hidden{
    display:none !important;
}

footer{
    margin-top:50px;
    background:#111827;
    color:#cbd5e1;
    text-align:center;
    padding:25px 20px;
    font-size:13px;
}

@media(max-width:700px){

    .navbar{
        flex-direction:column;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .form-group.full{
        grid-column:auto;
    }

    .form-card{
        padding:20px;
    }

    .button-row{
        flex-direction:column;
    }

}

</style>

</head>

<body>

<script>

/* ==========================================================
   SUPABASE
   ========================================================== */

const SUPABASE_URL =
    "https://hoogdxegjomtsvaddkwk.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_VEq6gUDlCthklOIgVUaDzQ_5TaqAsu8";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


/* ==========================================================
   ELEMENTS
   ========================================================== */

const loadingBox =
    document.getElementById("loadingBox");

const pageContent =
    document.getElementById("pageContent");

const messageBox =
    document.getElementById("message");

const vehicleForm =
    document.getElementById("vehicleForm");

const saveButton =
    document.getElementById("saveButton");


let currentUser = null;
let vehicleId = null;
let originalVehicle = null;


/* ==========================================================
   ESCAPE HTML
   ========================================================== */

function escapeHtml(value){

    if(
        value === null ||
        value === undefined
    ){
        return "";
    }

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* ==========================================================
   MESSAGE
   ========================================================== */

function showMessage(type,text){

    messageBox.className =
        "message " + type;

    messageBox.textContent =
        text;

    messageBox.scrollIntoView({
        behavior:"smooth",
        block:"center"
    });

}


/* ==========================================================
   GET VEHICLE ID FROM URL
   ========================================================== */

function getVehicleId(){

    const params =
        new URLSearchParams(
            window.location.search
        );

    return params.get("id");

}


/* ==========================================================
   LOAD VEHICLE
   ========================================================== */

async function loadVehicle(){

    try{

        /*
        ------------------------------------------------------
        CHECK LOGIN
        ------------------------------------------------------
        */

        const {
            data:sessionData,
            error:sessionError
        } =
            await supabaseClient
            .auth
            .getSession();


        if(sessionError){
            throw sessionError;
        }


        const session =
            sessionData.session;


        if(!session){

            window.location.href =
                "vendor-login.html";

            return;

        }


        currentUser =
            session.user;


        /*
        ------------------------------------------------------
        GET VEHICLE ID
        ------------------------------------------------------
        */

        vehicleId =
            getVehicleId();


        if(!vehicleId){

            throw new Error(
                "No vehicle ID was provided."
            );

        }


        /*
        ------------------------------------------------------
        IMPORTANT SECURITY CHECK
        ------------------------------------------------------

        We request the vehicle using BOTH:

        1. Vehicle ID
        2. Current vendor ID

        Therefore a vendor cannot load another
        vendor's vehicle through this page.
        ------------------------------------------------------
        */

        const {
            data,
            error
        } =
            await supabaseClient
            .from("vehicles")
            .select("*")
            .eq("id",vehicleId)
            .eq("vendor_id",currentUser.id)
            .single();


        if(error){

            throw new Error(
                "Vehicle not found or you do not have permission to edit it."
            );

        }


        originalVehicle =
            data;


        /*
        ------------------------------------------------------
        DISPLAY LISTING ID
        ------------------------------------------------------
        */

        document.getElementById(
            "listingIdDisplay"
        ).textContent =
            data.listing_id ||
            data.id;


        /*
        ------------------------------------------------------
        FILL FORM
        ------------------------------------------------------
        */

        document.getElementById("make")
            .value =
            data.make || "";


        document.getElementById("model")
            .value =
            data.model || "";


        document.getElementById("year")
            .value =
            data.year || "";


        document.getElementById("category")
            .value =
            data.category || "";


        document.getElementById("condition")
            .value =
            data.condition || "";


        document.getElementById("mileage")
            .value =
            data.mileage || "";


        document.getElementById("price")
            .value =
            data.price || "";


        document.getElementById("location")
            .value =
            data.location || "";


        document.getElementById("engine")
            .value =
            data.engine || "";


        document.getElementById("transmission")
            .value =
            data.transmission || "";


        document.getElementById("fuel")
            .value =
            data.fuel || "";


        document.getElementById("drive")
            .value =
            data.drive || "";


        document.getElementById("mainImage")
            .value =
            data.main_image || "";


        /*
        ------------------------------------------------------
        ADDITIONAL IMAGES
        ------------------------------------------------------
        */

        let images = [];

        if(Array.isArray(data.images)){

            images =
                data.images;

        }
        else if(
            typeof data.images === "string"
        ){

            try{

                const parsed =
                    JSON.parse(data.images);

                if(Array.isArray(parsed)){
                    images = parsed;
                }

            }catch(error){

                images = [];

            }

        }


        /*
        Remove the main image from the
        additional image list.
        */

        const mainImage =
            data.main_image || "";


        const additionalImages =
            images.filter(
                image =>
                    image &&
                    image !== mainImage
            );


        document.getElementById(
            "additionalImages"
        ).value =
            additionalImages.join("\n");


        document.getElementById(
            "description"
        ).value =
            data.description || "";


        loadingBox.style.display =
            "none";


        pageContent.classList.remove(
            "hidden"
        );


    }catch(error){

        console.error(
            "Vehicle loading error:",
            error
        );


        loadingBox.innerHTML = `

            <strong>
            Unable to load this vehicle.
            </strong>

            <br><br>

            ${escapeHtml(
                error.message ||
                "Unknown error."
            )}

            <br><br>

            <a href="vendor-dashboard.html">
            Return to Vendor Dashboard
            </a>

        `;

    }

}


/* ==========================================================
   SAVE CHANGES
   ========================================================== */

vehicleForm.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        if(!currentUser || !vehicleId){

            showMessage(
                "error",
                "Your vendor session or vehicle information is missing."
            );

            return;

        }


        saveButton.disabled =
            true;

        saveButton.textContent =
            "Saving...";


        try{

            /*
            --------------------------------------------------
            GET FORM VALUES
            --------------------------------------------------
            */

            const make =
                document.getElementById("make")
                .value
                .trim();


            const model =
                document.getElementById("model")
                .value
                .trim();


            const year =
                Number(
                    document.getElementById("year")
                    .value
                );


            const category =
                document.getElementById("category")
                .value;


            const condition =
                document.getElementById("condition")
                .value;


            const mileageValue =
                document.getElementById("mileage")
                .value;


            const mileage =
                mileageValue
                ? Number(mileageValue)
                : 0;


            const price =
                Number(
                    document.getElementById("price")
                    .value
                );


            const location =
                document.getElementById("location")
                .value
                .trim();


            const engine =
                document.getElementById("engine")
                .value
                .trim();


            const transmission =
                document.getElementById("transmission")
                .value;


            const fuel =
                document.getElementById("fuel")
                .value;


            const drive =
                document.getElementById("drive")
                .value;


            const mainImage =
                document.getElementById("mainImage")
                .value
                .trim();


            const description =
                document.getElementById("description")
                .value
                .trim();


            /*
            --------------------------------------------------
            ADDITIONAL IMAGES
            --------------------------------------------------
            */

            const additionalText =
                document.getElementById("additionalImages")
                .value
                .trim();


            const additionalImages =
                additionalText
                ?
                additionalText
                    .split(/\r?\n/)
                    .map(url => url.trim())
                    .filter(url => url.length > 0)
                :
                [];


            /*
            --------------------------------------------------
            VALIDATION
            --------------------------------------------------
            */

            if(!make || !model){

                throw new Error(
                    "Please enter the vehicle make and model."
                );

            }


            if(
                !year ||
                year < 1950 ||
                year > 2035
            ){

                throw new Error(
                    "Please enter a valid vehicle year."
                );

            }


            if(!category){

                throw new Error(
                    "Please select a vehicle category."
                );

            }


            if(
                !price ||
                price <= 0
            ){

                throw new Error(
                    "Please enter a valid vehicle price."
                );

            }


            if(!location){

                throw new Error(
                    "Please enter the vehicle location."
                );

            }


            if(!mainImage){

                throw new Error(
                    "Please enter the main vehicle image URL."
                );

            }


            /*
            --------------------------------------------------
            IMAGE ARRAY
            --------------------------------------------------
            */

            const images =
                [
                    mainImage,
                    ...additionalImages
                ];


            /*
            --------------------------------------------------
            UPDATE RECORD
            --------------------------------------------------

            vendor_id is deliberately NOT changed.

            listing_id is deliberately NOT changed.

            seller/payment/featured information is
            deliberately preserved.
            --------------------------------------------------
            */

            const updateData = {

                make:
                    make,

                model:
                    model,

                year:
                    year,

                category:
                    category,

                condition:
                    condition,

                price:
                    price,

                location:
                    location,

                mileage:
                    mileage,

                engine:
                    engine,

                transmission:
                    transmission,

                fuel:
                    fuel,

                drive:
                    drive,

                main_image:
                    mainImage,

                images:
                    images,

                description:
                    description

            };


            /*
            --------------------------------------------------
            UPDATE SUPABASE
            --------------------------------------------------
            */

            const {
                data,
                error
            } =
                await supabaseClient
                .from("vehicles")
                .update(updateData)
                .eq("id",vehicleId)
                .eq("vendor_id",currentUser.id)
                .select()
                .single();


            if(error){

                console.error(
                    "Vehicle update error:",
                    error
                );

                throw error;

            }


            /*
            --------------------------------------------------
            SUCCESS
            --------------------------------------------------
            */

            showMessage(
                "success",
                "Vehicle updated successfully."
            );


            setTimeout(
                () => {

                    window.location.href =
                        "vendor-dashboard.html";

                },
                1500
            );


        }catch(error){

            console.error(
                error
            );


            showMessage(
                "error",
                "Could not save changes: " +
                (
                    error.message ||
                    "Unknown database error."
                )
            );


        }finally{

            saveButton.disabled =
                false;

            saveButton.textContent =
                "Save Changes";

        }

    }
);


/* ==========================================================
   FOOTER YEAR
   ========================================================== */

document.getElementById("year")
    .textContent =
    new Date().getFullYear();


/* ==========================================================
   START
   ========================================================== */

loadVehicle();

</script>

</body>
