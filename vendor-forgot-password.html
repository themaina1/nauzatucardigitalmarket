<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Forgot Password | Nauza Tu Digital Motor Market</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f7fa;
    color:#1f2937;
    min-height:100vh;
    display:flex;
    flex-direction:column;
}

header{
    background:#111827;
    color:white;
}

.navbar{
    max-width:1100px;
    margin:auto;
    padding:16px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
}

.logo{
    color:#facc15;
    font-size:22px;
    font-weight:bold;
    text-decoration:none;
}

.nav-links{
    display:flex;
    gap:15px;
    flex-wrap:wrap;
}

.nav-links a{
    color:white;
    text-decoration:none;
    font-size:14px;
    font-weight:bold;
}

.nav-links a:hover{
    color:#facc15;
}

.container{
    width:100%;
    max-width:500px;
    margin:60px auto;
    padding:0 20px;
    flex:1;
}

.card{
    background:white;
    padding:30px;
    border-radius:12px;
    box-shadow:0 4px 18px rgba(0,0,0,.08);
}

h1{
    color:#111827;
    font-size:28px;
    margin-bottom:10px;
}

.intro{
    color:#667085;
    line-height:1.6;
    margin-bottom:25px;
}

label{
    display:block;
    font-size:14px;
    font-weight:bold;
    margin-bottom:7px;
}

input{
    width:100%;
    padding:13px;
    border:1px solid #d1d5db;
    border-radius:7px;
    font-size:15px;
    margin-bottom:15px;
}

input:focus{
    outline:none;
    border-color:#2563eb;
}

button{
    width:100%;
    padding:13px;
    border:none;
    border-radius:7px;
    background:#16a34a;
    color:white;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#15803d;
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.message{
    display:none;
    padding:14px;
    border-radius:7px;
    margin-bottom:18px;
    line-height:1.5;
}

.message.success{
    display:block;
    background:#dcfce7;
    color:#166534;
    border-left:5px solid #16a34a;
}

.message.error{
    display:block;
    background:#fee2e2;
    color:#991b1b;
    border-left:5px solid #dc2626;
}

.links{
    text-align:center;
    margin-top:20px;
}

.links a{
    color:#2563eb;
    text-decoration:none;
    font-size:14px;
}

.links a:hover{
    text-decoration:underline;
}

footer{
    background:#111827;
    color:#cbd5e1;
    text-align:center;
    padding:25px 20px;
    font-size:13px;
}

@media(max-width:650px){

    .navbar{
        flex-direction:column;
    }

    .container{
        margin:35px auto;
    }

    .card{
        padding:22px;
    }

}

</style>

</head>

<body>


<header>

<div class="navbar">

<a href="index.html" class="logo">
Nauza Tu
</a>

<nav class="nav-links">

<a href="index.html">
Home
</a>

<a href="vehicles.html">
Vehicles
</a>

<a href="vendor-login.html">
Vendor Login
</a>

</nav>

</div>

</header>


<main class="container">

<div class="card">

<h1>
Forgot Password?
</h1>

<p class="intro">

Enter the email address you used to register your
Nauza Tu vendor account. We will send you a password
reset link.

</p>


<div id="message" class="message"></div>


<form id="forgotForm">

<label for="email">
Vendor Email
</label>

<input
type="email"
id="email"
placeholder="Enter your email address"
required
autocomplete="email"
>


<button
type="submit"
id="submitButton"
>
Send Reset Link
</button>

</form>


<div class="links">

<a href="vendor-login.html">
← Back to Vendor Login
</a>

</div>


</div>

</main>


<footer>

© <span id="year"></span>
Nauza Tu Digital Motor Market.
All rights reserved.

</footer>


<script>

/* ==========================================================
   SUPABASE
   ========================================================== */

const SUPABASE_URL =
    "https://hoogdxegjomtsvaddkwk.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_VEq6gUDlCthklOIgVUaDzQ_5TaqAsu8";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


/* ==========================================================
   ELEMENTS
   ========================================================== */

const forgotForm =
    document.getElementById("forgotForm");

const emailInput =
    document.getElementById("email");

const submitButton =
    document.getElementById("submitButton");

const messageBox =
    document.getElementById("message");


/* ==========================================================
   MESSAGE
   ========================================================== */

function showMessage(type,text){

    messageBox.className =
        "message " + type;

    messageBox.textContent =
        text;

}


/* ==========================================================
   PASSWORD RESET
   ========================================================== */

forgotForm.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        const email =
            emailInput.value
            .trim()
            .toLowerCase();


        if(!email){

            showMessage(
                "error",
                "Please enter your email address."
            );

            return;

        }


        submitButton.disabled =
            true;

        submitButton.textContent =
            "Sending...";


        messageBox.className =
            "message";

        messageBox.textContent =
            "";


        try{

            /*
            --------------------------------------------------
            IMPORTANT

            The reset link returns to the public GitHub
            Pages site, not localhost.
            --------------------------------------------------
            */

            const redirectTo =
                window.location.origin +
                window.location.pathname
                    .replace(
                        "vendor-forgot-password.html",
                        "vendor-reset-password.html"
                    );


            const {
                error
            } =
                await supabaseClient
                .auth
                .resetPasswordForEmail(
                    email,
                    {
                        redirectTo:
                            redirectTo
                    }
                );


            if(error){

                throw error;

            }


            showMessage(
                "success",
                "Password reset instructions have been sent. Check your email and open the reset link."
            );


            emailInput.value =
                "";


        }catch(error){

            console.error(
                "Password reset error:",
                error
            );


            showMessage(
                "error",
                error.message ||
                "Unable to send the password reset email."
            );


        }finally{

            submitButton.disabled =
                false;

            submitButton.textContent =
                "Send Reset Link";

        }

    }
);


/* ==========================================================
   FOOTER YEAR
   ========================================================== */

document.getElementById("year")
    .textContent =
    new Date().getFullYear();

</script>

</body>
</html>
