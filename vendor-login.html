
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vendor Login | Nauza Tu Digital Motor Market</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f6f5;color:#222}
header,footer{background:#063d28;color:white;padding:18px}
.header-inner{max-width:1000px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:15px}
.logo{font-size:20px;font-weight:bold}.logo span{color:#e7b94f}
.back{color:white;text-decoration:none;border:1px solid white;padding:8px 12px;border-radius:6px}
main{min-height:calc(100vh - 140px);padding:45px 15px}
.card{max-width:450px;margin:auto;background:white;padding:30px;border-radius:12px;box-shadow:0 5px 25px #0001}
h1{margin-top:0;color:#063d28;font-size:27px}
.intro{color:#666;line-height:1.5;margin-bottom:25px}
label{display:block;margin:15px 0 6px;font-weight:bold;font-size:14px}
input{width:100%;padding:13px;border:1px solid #ccc;border-radius:7px;font-size:15px}
button.login-button{width:100%;margin-top:25px;padding:14px;border:0;border-radius:7px;background:#063d28;color:white;font-size:16px;font-weight:bold;cursor:pointer}
button:disabled{opacity:.6}
.message{display:none;margin-top:18px;padding:13px;border-radius:7px;line-height:1.5;font-size:14px}
.error{background:#ffebee;color:#b71c1c}
.success{background:#e8f5e9;color:#1b5e20}
.links,.register-box{text-align:center;margin-top:22px;line-height:2;font-size:14px}
.register-box{padding-top:20px;border-top:1px solid #ddd;color:#666}
a{color:#063d28;font-weight:bold;text-decoration:none}
footer{text-align:center;font-size:13px}
@media(max-width:600px){.card{padding:24px 18px}.header-inner{flex-direction:column;align-items:flex-start}}
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="logo">NAUZA TU <span>Digital Motor Market</span></div>
    <a href="index.html" class="back">← Back to Market</a>
  </div>
</header>

<main>
<div class="card">
<h1>Vendor Login</h1>
<p class="intro">Log in to manage your vehicle listings on Nauza Tu Digital Motor Market.</p>

<form id="loginForm">
<label for="email">Email Address</label>
<input type="email" id="email" autocomplete="email" placeholder="Enter your email" required>

<label for="password">Password</label>
<input type="password" id="password" autocomplete="current-password" placeholder="Enter your password" required>

<button type="submit" class="login-button" id="loginButton">Log In</button>
<div id="message" class="message"></div>
</form>

<div class="links"><a href="vendor-forgot-password.html">Forgot Password?</a></div>
<div class="register-box">Don't have a vendor account?<br><a href="vendor-register.html">Register as a Vendor</a></div>
</div>
</main>

<footer>© 2026 Nauza Tu Digital Motor Market. All rights reserved.</footer>

<script>
const SUPABASE_URL = "https://hoogdxegjomtsvaddkwk.supabase.co";
const SUPABASE_KEY = "sb_publishable_VEq6gUDlCthklOIgVUaDzQ_5TaqAsu8";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const form = document.getElementById("loginForm");
const button = document.getElementById("loginButton");
const message = document.getElementById("message");
const DRAFT_KEY = "nauzatu_pending_vendor_profile";

function showMessage(text, type) {
  message.textContent = text;
  message.className = "message " + type;
  message.style.display = "block";
}

async function completePendingProfile(user) {
  const raw = localStorage.getItem(DRAFT_KEY);
  if (!raw) return false;

  let draft;
  try {
    draft = JSON.parse(raw);
  } catch {
    localStorage.removeItem(DRAFT_KEY);
    throw new Error("Saved registration details could not be read. Please contact support.");
  }

  // Only apply the saved details to the account used during registration.
  if (!draft.email || draft.email.toLowerCase() !== (user.email || "").toLowerCase()) {
    return false;
  }

  if (!draft.profile || !draft.profile.full_name || !draft.profile.phone || !draft.profile.location) {
    throw new Error("Your saved vendor details are incomplete. Please register again only if no account was created.");
  }

  const { data: existing, error: checkError } = await sb
    .from("vendor_profiles")
    .select("id")
    .eq("id", user.id)
    .maybeSingle();

  if (checkError) throw checkError;

  if (existing) {
    const { error } = await sb
      .from("vendor_profiles")
      .update(draft.profile)
      .eq("id", user.id);

    if (error) throw error;
  } else {
    const { error } = await sb
      .from("vendor_profiles")
      .insert({ id: user.id, ...draft.profile });

    if (error) throw error;
  }

  localStorage.removeItem(DRAFT_KEY);
  return true;
}

form.addEventListener("submit", async function(event) {
  event.preventDefault();
  message.style.display = "none";
  button.disabled = true;
  button.textContent = "Logging in...";

  const email = document.getElementById("email").value.trim().toLowerCase();
  const password = document.getElementById("password").value;

  try {
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if (error) throw error;
    if (!data.user || !data.session) {
      throw new Error("Login did not create an authenticated session. Please try again.");
    }

    try {
      const completed = await completePendingProfile(data.user);

      if (completed) {
        showMessage("Login successful. Your vendor profile has been saved. Opening your dashboard...", "success");
      } else {
        showMessage("Login successful. Opening your vendor dashboard...", "success");
      }

      setTimeout(() => {
        window.location.href = "vendor-dashboard.html";
      }, 1200);
    } catch (profileError) {
      console.error("Profile completion error:", profileError);
      showMessage(
        "You are logged in, but your vendor profile could not be saved: " +
        profileError.message +
        ". Your account remains created. Do not register again; please contact support with this error.",
        "error"
      );
    }
  } catch (error) {
    console.error("Vendor login error:", error);
    let text = error.message || "Unable to log in.";

    if (text.toLowerCase().includes("email not confirmed")) {
      text = "Your email has not been confirmed. Check your email and click the confirmation link before logging in.";
    } else if (text.toLowerCase().includes("invalid login credentials")) {
      text = "The email or password is incorrect.";
    }

    showMessage(text, "error");
  } finally {
    button.disabled = false;
    button.textContent = "Log In";
  }
});
</script>
</body>
</html>
