<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vendor Login | Nauza Tu Digital Motor Market</title>

<meta name="description"
content="Vendor login for Nauza Tu Digital Motor Market.">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #f4f6f5;
  color: #222;
}

header {
  background: #063d28;
  color: white;
  padding: 18px;
}

.header-inner {
  max-width: 1000px;
  margin: auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
}

.logo {
  font-size: 20px;
  font-weight: bold;
}

.logo span {
  color: #e7b94f;
}

.back {
  color: white;
  text-decoration: none;
  border: 1px solid white;
  padding: 8px 12px;
  border-radius: 6px;
  font-size: 14px;
}

main {
  min-height: calc(100vh - 140px);
  padding: 45px 15px;
}

.card {
  max-width: 450px;
  margin: auto;
  background: white;
  padding: 30px;
  border-radius: 12px;
  box-shadow: 0 5px 25px rgba(0,0,0,.08);
}

h1 {
  margin-top: 0;
  color: #063d28;
  font-size: 27px;
}

.intro {
  color: #666;
  line-height: 1.5;
  margin-bottom: 25px;
}

label {
  display: block;
  margin: 15px 0 6px;
  font-weight: bold;
  font-size: 14px;
}

input {
  width: 100%;
  padding: 13px;
  border: 1px solid #ccc;
  border-radius: 7px;
  font-size: 15px;
  outline: none;
}

input:focus {
  border-color: #063d28;
}

.password-row {
  position: relative;
}

.password-row input {
  padding-right: 75px;
}

.show-password {
  position: absolute;
  right: 8px;
  top: 8px;
  padding: 6px 8px;
  margin: 0;
  width: auto;
  background: transparent;
  color: #063d28;
  font-size: 12px;
  border: 0;
  cursor: pointer;
}

button.login-button {
  width: 100%;
  margin-top: 25px;
  padding: 14px;
  border: 0;
  border-radius: 7px;
  background: #063d28;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button.login-button:hover {
  background: #075437;
}

button.login-button:disabled {
  opacity: .6;
  cursor: not-allowed;
}

.message {
  display: none;
  margin-top: 18px;
  padding: 13px;
  border-radius: 7px;
  line-height: 1.5;
  font-size: 14px;
}

.error {
  background: #ffebee;
  color: #b71c1c;
  border: 1px solid #ef9a9a;
}

.success {
  background: #e8f5e9;
  color: #1b5e20;
  border: 1px solid #a5d6a7;
}

.links {
  text-align: center;
  margin-top: 22px;
  line-height: 2;
  font-size: 14px;
}

.links a {
  color: #063d28;
  font-weight: bold;
  text-decoration: none;
}

.register-box {
  margin-top: 25px;
  padding-top: 20px;
  border-top: 1px solid #ddd;
  text-align: center;
  color: #666;
  font-size: 14px;
}

.register-box a {
  color: #063d28;
  font-weight: bold;
  text-decoration: none;
}

footer {
  background: #063d28;
  color: white;
  text-align: center;
  padding: 18px;
  font-size: 13px;
}

@media (max-width: 600px) {
  .card {
    padding: 24px 18px;
  }

  .header-inner {
    flex-direction: column;
    align-items: flex-start;
  }
}
</style>
</head>

<body>

<header>
  <div class="header-inner">

    <div class="logo">
      NAUZA TU <span>Digital Motor Market</span>
    </div>

    <a href="index.html" class="back">
      ← Back to Market
    </a>

  </div>
</header>


<main>

<div class="card">

<h1>Vendor Login</h1>

<p class="intro">
Log in to manage your vehicle listings on
Nauza Tu Digital Motor Market.
</p>


<form id="loginForm">

<label for="email">
Email Address
</label>

<input
  type="email"
  id="email"
  placeholder="Enter your email"
  autocomplete="email"
  required
>


<label for="password">
Password
</label>

<div class="password-row">

<input
  type="password"
  id="password"
  placeholder="Enter your password"
  autocomplete="current-password"
  required
>

<button
  type="button"
  class="show-password"
  id="showPassword">
  Show
</button>

</div>


<button
  type="submit"
  class="login-button"
  id="loginButton">
  Log In
</button>


<div
  id="message"
  class="message">
</div>

</form>


<div class="links">

<a href="vendor-forgot-password.html">
Forgot Password?
</a>

</div>


<div class="register-box">

Don't have a vendor account?

<br>

<a href="vendor-register.html">
Register as a Vendor
</a>

</div>

</div>

</main>


<footer>
© 2026 Nauza Tu Digital Motor Market. All rights reserved.
</footer>


<script>

/* =========================================================
   SUPABASE CONFIGURATION
   COPY THE EXACT SAME VALUES FROM YOUR WORKING
   vehicles.html
   ========================================================= */

const SUPABASE_URL =
"https://hoogdxegjomtsvaddkwk.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_VEq6gUDlCthklOIgVUaDzQ_5TaqAsu8";


const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL.trim(),
  SUPABASE_PUBLISHABLE_KEY.trim()
);


/* =========================================================
   ELEMENTS
   ========================================================= */

const loginForm =
document.getElementById("loginForm");

const loginButton =
document.getElementById("loginButton");

const message =
document.getElementById("message");

const passwordInput =
document.getElementById("password");

const showPasswordButton =
document.getElementById("showPassword");


/* =========================================================
   MESSAGE
   ========================================================= */

function showMessage(text, type) {

  message.textContent = text;

  message.className =
  "message " + type;

  message.style.display = "block";
}


/* =========================================================
   SHOW / HIDE PASSWORD
   ========================================================= */

showPasswordButton.addEventListener(
  "click",
  function() {

    if (passwordInput.type === "password") {

      passwordInput.type = "text";

      showPasswordButton.textContent =
      "Hide";

    } else {

      passwordInput.type = "password";

      showPasswordButton.textContent =
      "Show";
    }

  }
);


/* =========================================================
   LOGIN
   ========================================================= */

loginForm.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();

    message.style.display = "none";

    const email =
    document.getElementById("email")
    .value
    .trim();

    const password =
    document.getElementById("password")
    .value;


    if (!email || !password) {

      showMessage(
        "Please enter your email and password.",
        "error"
      );

      return;
    }


    loginButton.disabled = true;

    loginButton.textContent =
    "Logging in...";


    try {

      const result =
      await supabaseClient.auth.signInWithPassword({

        email: email,

        password: password

      });


      console.log(
        "Vendor login result:",
        result
      );


      if (result.error) {

        throw result.error;

      }


      if (!result.data.user) {

        throw new Error(
          "Login was unsuccessful. Please try again."
        );

      }


      showMessage(
        "Login successful. Opening your vendor dashboard...",
        "success"
      );


      setTimeout(
        function() {

          window.location.href =
          "vendor-dashboard.html";

        },
        1000
      );


    } catch (error) {

      console.error(
        "Vendor login error:",
        error
      );


      let errorMessage =
      error.message ||
      "Unable to log in.";


      if (
        errorMessage
        .toLowerCase()
        .includes("email not confirmed")
      ) {

        errorMessage =
        "Your email has not been confirmed yet. Please check your email and click the confirmation link before logging in.";

      }


      if (
        errorMessage
        .toLowerCase()
        .includes("invalid login credentials")
      ) {

        errorMessage =
        "The email or password is incorrect.";

      }


      showMessage(
        errorMessage,
        "error"
      );

    }


    loginButton.disabled = false;

    loginButton.textContent =
    "Log In";

  }
);

</script>

</body>
</html>
