<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Reset Vendor Password | Nauza Tu Digital Motor Market</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    header p {
      margin: 6px 0 0;
      color: #d1d5db;
      font-size: 14px;
    }

    .container {
      width: 100%;
      max-width: 430px;
      margin: 50px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    h2 {
      margin-top: 0;
      text-align: center;
      color: #111827;
    }

    .intro {
      text-align: center;
      color: #666;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 25px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
      font-size: 14px;
    }

    .password-box {
      position: relative;
      margin-bottom: 18px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 7px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #2563eb;
    }

    .show-password {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: #2563eb;
      font-size: 13px;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 7px;
      background: #16a34a;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn:hover {
      background: #15803d;
    }

    .btn:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 12px;
      border-radius: 7px;
      font-size: 14px;
      line-height: 1.5;
    }

    .success {
      display: block;
      background: #dcfce7;
      color: #166534;
      border: 1px solid #86efac;
    }

    .error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fca5a5;
    }

    .login-link {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
    }

    .login-link a {
      color: #2563eb;
      text-decoration: none;
      font-weight: bold;
    }

    .login-link a:hover {
      text-decoration: underline;
    }

    .loading {
      text-align: center;
      color: #666;
      font-size: 14px;
      margin-bottom: 15px;
    }
  </style>
</head>

<body>

<header>
  <h1>Nauza Tu Digital Motor Market</h1>
  <p>Vendor Account</p>
</header>

<div class="container">

  <div class="card">

    <h2>Reset Your Password</h2>

    <p class="intro">
      Enter your new password below. Your password should be at least
      6 characters long.
    </p>

    <div id="loadingMessage" class="loading">
      Checking password reset link...
    </div>

    <form id="resetForm" style="display:none;">

      <label for="password">New Password</label>

      <div class="password-box">
        <input
          type="password"
          id="password"
          placeholder="Enter new password"
          minlength="6"
          required
        >

        <button
          type="button"
          class="show-password"
          onclick="togglePassword('password', this)"
        >
          Show
        </button>
      </div>


      <label for="confirmPassword">Confirm New Password</label>

      <div class="password-box">
        <input
          type="password"
          id="confirmPassword"
          placeholder="Confirm new password"
          minlength="6"
          required
        >

        <button
          type="button"
          class="show-password"
          onclick="togglePassword('confirmPassword', this)"
        >
          Show
        </button>
      </div>


      <button
        type="submit"
        class="btn"
        id="resetButton"
      >
        Update Password
      </button>

    </form>


    <div id="message" class="message"></div>

    <div class="login-link">
      <a href="vendor-login.html">Back to Vendor Login</a>
    </div>

  </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

  const SUPABASE_URL =
    "https://hoogdxegjomtsvaddkwk.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_VEq6gUDlCthklOIgVUaDzQ_5TaqAsu8";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  const loadingMessage =
    document.getElementById("loadingMessage");

  const resetForm =
    document.getElementById("resetForm");

  const message =
    document.getElementById("message");

  const resetButton =
    document.getElementById("resetButton");


  function showMessage(text, type) {

    message.textContent = text;

    message.className =
      "message " + type;

  }


  function togglePassword(fieldId, button) {

    const field =
      document.getElementById(fieldId);

    if (field.type === "password") {

      field.type = "text";

      button.textContent = "Hide";

    } else {

      field.type = "password";

      button.textContent = "Show";

    }

  }


  async function prepareResetPage() {

    try {

      /*
       * Supabase sends the user back to this page
       * with a recovery session.
       */

      const { data, error } =
        await supabaseClient.auth.getSession();


      if (error) {

        throw error;

      }


      if (data.session) {

        loadingMessage.style.display = "none";

        resetForm.style.display = "block";

        return;

      }


      /*
       * Listen for the PASSWORD_RECOVERY event.
       */

      const {
        data: authListener
      } =
        supabaseClient.auth.onAuthStateChange(
          async (event, session) => {

            if (
              event === "PASSWORD_RECOVERY" &&
              session
            ) {

              loadingMessage.style.display =
                "none";

              resetForm.style.display =
                "block";

            }

          }
        );


      /*
       * Give Supabase a moment to process
       * the recovery information in the URL.
       */

      setTimeout(async () => {

        const { data: latest } =
          await supabaseClient.auth.getSession();


        if (latest.session) {

          loadingMessage.style.display =
            "none";

          resetForm.style.display =
            "block";

        } else {

          loadingMessage.style.display =
            "none";

          showMessage(
            "This password reset link is missing, expired, or has already been used. Please request a new password reset link.",
            "error"
          );

        }

      }, 1500);

    } catch (error) {

      console.error(error);

      loadingMessage.style.display =
        "none";

      showMessage(
        error.message ||
        "Unable to verify the password reset link.",
        "error"
      );

    }

  }


  resetForm.addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();


      const password =
        document.getElementById("password")
          .value.trim();

      const confirmPassword =
        document.getElementById("confirmPassword")
          .value.trim();


      if (password.length < 6) {

        showMessage(
          "Password must be at least 6 characters long.",
          "error"
        );

        return;

      }


      if (password !== confirmPassword) {

        showMessage(
          "The two passwords do not match.",
          "error"
        );

        return;

      }


      resetButton.disabled = true;

      resetButton.textContent =
        "Updating Password...";


      try {

        const { data, error } =
          await supabaseClient.auth.updateUser({
            password: password
          });


        if (error) {

          throw error;

        }


        showMessage(
          "Your password has been successfully changed. You can now log in with your new password.",
          "success"
        );


        resetForm.reset();

        resetButton.textContent =
          "Password Updated";


        setTimeout(() => {

          window.location.href =
            "vendor-login.html";

        }, 2500);


      } catch (error) {

        console.error(error);

        showMessage(
          error.message ||
          "Could not update your password. Please request a new reset link and try again.",
          "error"
        );

        resetButton.disabled = false;

        resetButton.textContent =
          "Update Password";

      }

    }
  );


  prepareResetPage();

</script>

</body>
</html>
